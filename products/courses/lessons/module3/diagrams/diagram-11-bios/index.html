<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIOS &amp; UEFI Setup Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">BIOS &amp; UEFI Setup</h1>
      <p class="diagram-subtitle">First-boot configuration &mdash; navigate BIOS menus and see what each setting controls</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive BIOS/UEFI setup screen with clickable menu items and motherboard diagram">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="22">BIOS / UEFI Setup Utility</text>

          <!-- BIOS Screen Frame -->
          <rect class="bios-screen" x="30" y="36" width="640" height="460" rx="6"/>

          <!-- BIOS Header Bar -->
          <rect class="bios-header" x="30" y="36" width="640" height="36" rx="6"/>
          <rect class="bios-header" x="30" y="62" width="640" height="10"/>
          <text class="bios-header-text" x="350" y="60">UEFI BIOS Utility &mdash; EZ Mode</text>

          <!-- Left Menu -->
          <g id="menu-boot" class="bios-menu-item" data-menu="boot">
            <rect class="menu-icon-bg" x="48" y="80" width="28" height="28" rx="6"/>
            <text x="62" y="98" fill="#0959C8" font-size="14" text-anchor="middle" font-family="var(--font-display)" font-weight="700">B</text>
            <text class="menu-label" x="88" y="98">Boot Order</text>
          </g>
          <g id="menu-cpu" class="bios-menu-item" data-menu="cpu">
            <rect class="menu-icon-bg" x="48" y="120" width="28" height="28" rx="6"/>
            <text x="62" y="138" fill="#0959C8" font-size="14" text-anchor="middle" font-family="var(--font-display)" font-weight="700">C</text>
            <text class="menu-label" x="88" y="138">CPU Settings</text>
          </g>
          <g id="menu-ram" class="bios-menu-item" data-menu="ram">
            <rect class="menu-icon-bg" x="48" y="160" width="28" height="28" rx="6"/>
            <text x="62" y="178" fill="#0959C8" font-size="14" text-anchor="middle" font-family="var(--font-display)" font-weight="700">R</text>
            <text class="menu-label" x="88" y="178">RAM / XMP</text>
          </g>
          <g id="menu-fan" class="bios-menu-item" data-menu="fan">
            <rect class="menu-icon-bg" x="48" y="200" width="28" height="28" rx="6"/>
            <text x="62" y="218" fill="#0959C8" font-size="14" text-anchor="middle" font-family="var(--font-display)" font-weight="700">F</text>
            <text class="menu-label" x="88" y="218">Fan Control</text>
          </g>
          <g id="menu-secure" class="bios-menu-item" data-menu="secure">
            <rect class="menu-icon-bg" x="48" y="240" width="28" height="28" rx="6"/>
            <text x="62" y="258" fill="#0959C8" font-size="14" text-anchor="middle" font-family="var(--font-display)" font-weight="700">S</text>
            <text class="menu-label" x="88" y="258">Secure Boot</text>
          </g>

          <!-- Settings Panel -->
          <g id="settings-panel">
            <rect class="settings-panel" x="180" y="80" width="280" height="240" rx="4"/>
            <text class="settings-title" x="320" y="104" text-anchor="middle" id="settingsTitle">Boot Order</text>

            <rect class="settings-row bg" x="190" y="114" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="130">Boot Option #1</text>
            <text class="settings-value" x="380" y="130">NVMe SSD</text>

            <rect class="settings-row" x="190" y="138" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="154">Boot Option #2</text>
            <text class="settings-value" x="380" y="154">SATA HDD</text>

            <rect class="settings-row bg" x="190" y="162" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="178">Boot Option #3</text>
            <text class="settings-value" x="380" y="178">USB Drive</text>

            <rect class="settings-row" x="190" y="186" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="202">Fast Boot</text>
            <text class="settings-enabled" x="380" y="202">Enabled</text>

            <rect class="settings-row bg" x="190" y="210" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="226">CSM (Compatibility)</text>
            <text class="settings-disabled" x="380" y="226">Disabled</text>

            <rect class="settings-row" x="190" y="234" width="260" height="22" rx="2"/>
            <text class="settings-label" x="200" y="250">Boot Override</text>
            <text class="settings-value" x="380" y="250" fill="#0959C8">[Select]</text>
          </g>

          <!-- Bottom info bar -->
          <text x="50" y="450" fill="var(--text-muted)" font-size="7" font-family="var(--font-body)">
            F7: Advanced Mode  |  F10: Save &amp; Exit  |  ESC: Discard  |  Enter: Select
          </text>

          <!-- Motherboard diagram on right -->
          <g transform="translate(690, 50)">
            <rect class="mobo-diagram" x="0" y="0" width="280" height="240" rx="4"/>
            <text class="diagram-chip-label" x="140" y="18" text-anchor="middle">Motherboard</text>
            <!-- CPU -->
            <rect x="30" y="30" width="60" height="60" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
            <text x="60" y="55" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">CPU</text>
            <rect class="mobo-highlight" id="mobo-cpu" x="28" y="28" width="64" height="64" rx="4"/>
            <!-- RAM -->
            <rect x="100" y="30" width="80" height="16" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <rect x="100" y="50" width="80" height="16" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="140" y="42" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">DIMM</text>
            <rect class="mobo-highlight" id="mobo-ram" x="98" y="28" width="84" height="40" rx="4"/>
            <!-- PCIe -->
            <rect x="30" y="100" width="200" height="10" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <rect x="30" y="116" width="100" height="10" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="130" y="108" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">PCIe</text>
            <rect class="mobo-highlight" id="mobo-storage" x="28" y="98" width="204" height="30" rx="4"/>
            <!-- Chipset -->
            <rect x="30" y="140" width="40" height="40" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="50" y="165" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">PCH</text>
            <rect class="mobo-highlight" id="mobo-chipset" x="28" y="138" width="44" height="44" rx="4"/>
            <!-- SATA -->
            <rect x="100" y="140" width="50" height="20" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="125" y="153" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">SATA</text>
            <!-- USB header -->
            <rect x="160" y="140" width="50" height="20" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="185" y="153" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle">USB</text>
            <!-- Fan headers -->
            <rect x="30" y="195" width="30" height="16" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="45" y="205" fill="rgba(255,255,255,0.2)" font-size="5" text-anchor="middle">FAN</text>
            <rect x="70" y="195" width="30" height="16" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="85" y="205" fill="rgba(255,255,255,0.2)" font-size="5" text-anchor="middle">FAN</text>
            <rect class="mobo-highlight" id="mobo-fan" x="28" y="193" width="74" height="20" rx="4"/>
          </g>

          <!-- POST Progress Bar -->
          <g transform="translate(30, 506)">
            <rect class="post-bar-bg" x="0" y="0" width="940" height="24" rx="4"/>
            <rect class="post-bar-fill" id="postBarFill" x="2" y="2" width="0" height="20" rx="3"/>
            <text class="post-text" id="postText" x="470" y="16" text-anchor="middle">POST — Press DEL/F2 to enter BIOS</text>
          </g>

          <!-- Info text -->
          <text x="30" y="560" fill="var(--text-muted)" font-size="8" font-family="var(--font-body)" font-style="italic">
            Click a menu item on the left to see settings &amp; motherboard highlight
          </text>
        </svg>
      </div>
      <figcaption class="visually-hidden">BIOS/UEFI screen with interactive menu items: Boot Order, CPU Settings, RAM XMP, Fan Control, Secure Boot.</figcaption>
    </figure>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> for auto-navigate first-boot setup</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play BIOS setup navigation">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU &amp; Expansion Cards Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">GPU &amp; Expansion Cards</h1>
      <p class="diagram-subtitle">Graphics card anatomy and installation &mdash; from PCIe slot to power cables</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive GPU installation diagram showing card components and install steps">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glowStrong"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="22">Graphics Card &mdash; Anatomy &amp; Installation</text>

          <!-- Motherboard -->
          <g id="component-motherboard" class="component-group" data-component="motherboard">
            <rect class="mobo-base" x="40" y="140" width="380" height="340" rx="4"/>
            <rect x="50" y="150" width="80" height="60" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="90" y="165" fill="rgba(255,255,255,0.15)" font-size="6" text-anchor="middle" font-family="var(--font-body)">CPU Socket</text>
            <rect x="50" y="230" width="80" height="100" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="90" y="250" fill="rgba(255,255,255,0.15)" font-size="6" text-anchor="middle" font-family="var(--font-body)">RAM Slots</text>
            <rect x="50" y="350" width="80" height="110" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
            <text x="90" y="370" fill="rgba(255,255,255,0.15)" font-size="6" text-anchor="middle" font-family="var(--font-body)">Chipset</text>
            <!-- PCIe slots -->
            <rect class="pcie-slot" x="160" y="180" width="200" height="12" rx="2"/>
            <rect class="pcie-contacts" x="170" y="182" width="180" height="8" rx="1"/>
            <rect class="pcie-slot" x="160" y="210" width="200" height="12" rx="2"/>
            <rect class="pcie-contacts" x="170" y="212" width="60" height="8" rx="1"/>
            <rect class="pcie-slot" x="160" y="240" width="200" height="12" rx="2"/>
            <rect class="pcie-contacts" x="170" y="242" width="60" height="8" rx="1"/>
            <text x="240" y="205" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle" font-family="var(--font-body)">PCIe x16</text>
            <text x="240" y="238" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle" font-family="var(--font-body)">PCIe x1</text>
            <text x="240" y="268" fill="rgba(255,255,255,0.2)" font-size="6" text-anchor="middle" font-family="var(--font-body)">PCIe x1</text>
            <text class="component-name" x="230" y="480">Motherboard</text>
            <text class="component-desc" x="230" y="492">with PCIe x16 slot</text>
          </g>

          <!-- GPU -->
          <g id="gpu-card" class="gpu-card-group">
            <g id="component-gpu" class="component-group" data-component="gpu">
              <!-- GPU PCB -->
              <rect class="gpu-pcb" x="360" y="160" width="280" height="390" rx="4" id="gpuPcb"/>
              <!-- Backplate -->
              <rect class="gpu-backplate" x="365" y="165" width="270" height="380" rx="3"/>
              <!-- GPU Die -->
              <g data-component="gpu-die">
                <rect class="gpu-die" x="460" y="200" width="80" height="80" rx="2" id="gpuDie"/>
                <text class="gpu-die-text" x="500" y="235">GPU</text>
                <text class="gpu-die-text" x="500" y="248">Die</text>
              </g>
              <!-- VRAM Chips -->
              <g data-component="vram">
                <rect class="vram-chip" x="420" y="300" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="456" y="300" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="492" y="300" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="528" y="300" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="420" y="336" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="456" y="336" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="492" y="336" width="28" height="28" rx="2"/>
                <rect class="vram-chip" x="528" y="336" width="28" height="28" rx="2"/>
                <text x="474" y="380" fill="var(--text-muted)" font-size="7" text-anchor="middle" font-family="var(--font-body)">VRAM</text>
              </g>
              <!-- Cooler / Heatsink -->
              <g data-component="cooler">
                <rect class="gpu-cooler" x="400" y="180" width="200" height="140" rx="3" opacity="0.3"/>
                <path class="gpu-heatpipes" d="M420,200 L420,320 M450,200 L450,320 M510,200 L510,320 M540,200 L540,320 M570,200 L570,320"/>
                <text x="500" y="420" fill="var(--text-muted)" font-size="7" text-anchor="middle" font-family="var(--font-body)">Heatsink</text>
              </g>
              <!-- Fans on GPU -->
              <g data-component="gpu-fans">
                <circle class="gpu-fan" cx="440" cy="470" r="30"/>
                <circle cx="440" cy="470" r="6" fill="var(--surface-card)" stroke="var(--brand-primary)" stroke-width="0.8"/>
                <circle class="gpu-fan" cx="520" cy="470" r="30"/>
                <circle cx="520" cy="470" r="6" fill="var(--surface-card)" stroke="var(--brand-primary)" stroke-width="0.8"/>
                <text x="480" y="525" fill="var(--text-muted)" font-size="7" text-anchor="middle" font-family="var(--font-body)">Cooling Fans</text>
              </g>
              <!-- PCIe Bracket -->
              <rect class="gpu-bracket" x="350" y="160" width="14" height="130" rx="1"/>
              <!-- Power Connectors -->
              <g data-component="power-connectors">
                <rect class="power-connector" x="380" y="140" width="60" height="18" rx="2"/>
                <rect class="power-connector" x="455" y="140" width="60" height="18" rx="2"/>
                <text x="440" y="136" fill="var(--text-muted)" font-size="6" text-anchor="middle" font-family="var(--font-body)">PCIe Power (6+2 pin)</text>
              </g>
              <!-- Power Cables -->
              <path class="power-cable" d="M380,149 L320,100 L280,100" id="cable1"/>
              <path class="power-cable" d="M455,149 L380,90 L340,90" id="cable2"/>
            </g>
          </g>

          <!-- Installation steps -->
          <g transform="translate(680, 130)">
            <text x="120" y="0" fill="var(--text-muted)" font-size="9" text-anchor="middle" font-family="var(--font-display)" font-weight="600" letter-spacing="1" text-transform="uppercase">Installation Steps</text>

            <rect class="install-step" id="step0" x="20" y="14" width="200" height="32" rx="6"/>
            <text class="install-label" x="120" y="34">1. Align GPU with PCIe slot</text>

            <rect class="install-step" id="step1" x="20" y="58" width="200" height="32" rx="6"/>
            <text class="install-label" x="120" y="78">2. Insert firmly until click</text>

            <rect class="install-step" id="step2" x="20" y="102" width="200" height="32" rx="6"/>
            <text class="install-label" x="120" y="122">3. Secure bracket to case</text>

            <rect class="install-step" id="step3" x="20" y="146" width="200" height="32" rx="6"/>
            <text class="install-label" x="120" y="166">4. Connect PCIe power cables</text>

            <rect class="install-step" id="step4" x="20" y="190" width="200" height="32" rx="6"/>
            <text class="install-label" x="120" y="210">5. Install GPU drivers</text>
          </g>

          <!-- Legend -->
          <g transform="translate(40, 545)">
            <text class="legend-title" x="0" y="0">GPU Components</text>
            <text class="legend-text" x="200" y="0" font-style="italic">Click components or steps for info</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">Animation: Graphics card slides into PCIe slot, power cables connect, and bracket screws to case.</figcaption>
    </figure>
    <div class="info-panel" id="infoPanel" role="status" aria-live="polite">
      <div class="info-panel-title" id="infoTitle">Component</div>
      <div class="info-panel-desc" id="infoDesc">Click a component to learn more</div>
    </div>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to see GPU installation animation</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play GPU installation animation">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

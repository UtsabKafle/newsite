<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troubleshooting &amp; Maintenance Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">Troubleshooting &amp; Maintenance</h1>
      <p class="diagram-subtitle">Diagnostic dashboard &mdash; gauges, issue cards, and maintenance tools</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive diagnostic dashboard with gauges, issue cards, and scan animation">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="22">Diagnostic Dashboard</text>

          <!-- Gauges -->
          <g transform="translate(30, 40)">
            <text class="legend-title" x="0" y="0">System Gauges</text>

            <!-- CPU Temp -->
            <g id="gauge-temp" class="dash-panel" transform="translate(0, 14)">
              <rect x="0" y="0" width="130" height="140" rx="8"/>
              <circle class="gauge-bg" cx="65" cy="65" r="45"/>
              <circle class="gauge-fill" id="gaugeTempFill" cx="65" cy="65" r="45" fill="none" stroke-dasharray="283" stroke-dashoffset="200" transform="rotate(-90 65 65)"/>
              <text class="gauge-value" id="gaugeTempValue" x="65" y="62">52</text>
              <text class="gauge-label" x="65" y="76">&deg;C</text>
              <text class="gauge-label" x="65" y="120">CPU Temp</text>
              <text class="gauge-label" x="65" y="132">Normal</text>
            </g>

            <!-- Fan Speed -->
            <g class="dash-panel" transform="translate(140, 14)">
              <rect x="0" y="0" width="130" height="140" rx="8"/>
              <circle class="gauge-bg" cx="65" cy="65" r="45"/>
              <circle class="gauge-fill" id="gaugeFanFill" cx="65" cy="65" r="45" fill="none" stroke-dasharray="283" stroke-dashoffset="140" transform="rotate(-90 65 65)"/>
              <text class="gauge-value" id="gaugeFanValue" x="65" y="62">1200</text>
              <text class="gauge-label" x="65" y="76">RPM</text>
              <text class="gauge-label" x="65" y="120">Fan Speed</text>
              <text class="gauge-label" x="65" y="132">Normal</text>
            </g>

            <!-- Voltage -->
            <g class="dash-panel" transform="translate(280, 14)">
              <rect x="0" y="0" width="130" height="140" rx="8"/>
              <circle class="gauge-bg" cx="65" cy="65" r="45"/>
              <circle class="gauge-fill" id="gaugeVoltFill" cx="65" cy="65" r="45" fill="none" stroke-dasharray="283" stroke-dashoffset="80" transform="rotate(-90 65 65)"/>
              <text class="gauge-value" id="gaugeVoltValue" x="65" y="62">12.2</text>
              <text class="gauge-label" x="65" y="76">V</text>
              <text class="gauge-label" x="65" y="120">Voltage Rail</text>
              <text class="gauge-label" x="65" y="132">12V Rail</text>
            </g>

            <!-- Memory -->
            <g class="dash-panel" transform="translate(420, 14)">
              <rect x="0" y="0" width="130" height="140" rx="8"/>
              <circle class="gauge-bg" cx="65" cy="65" r="45"/>
              <circle class="gauge-fill" id="gaugeMemFill" cx="65" cy="65" r="45" fill="none" stroke-dasharray="283" stroke-dashoffset="170" transform="rotate(-90 65 65)"/>
              <text class="gauge-value" id="gaugeMemValue" x="65" y="62">40</text>
              <text class="gauge-label" x="65" y="76">%</text>
              <text class="gauge-label" x="65" y="120">Memory Usage</text>
              <text class="gauge-label" x="65" y="132">8GB/16GB</text>
            </g>
          </g>

          <!-- Issue Cards -->
          <g transform="translate(30, 200)">
            <text class="legend-title" x="0" y="0">Common Issues</text>

            <g id="issue-nopost" class="issue-card" data-issue="nopost">
              <rect x="0" y="10" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="10" y="18" width="20" height="20" rx="4"/>
              <text x="20" y="32" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="80" y="32">No POST</text>
              <text class="gauge-label" x="80" y="48">System won&rsquo;t start</text>
              <text class="gauge-label" x="80" y="60">No display output</text>
            </g>

            <g id="issue-bsod" class="issue-card" data-issue="bsod">
              <rect x="172" y="10" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="182" y="18" width="20" height="20" rx="4"/>
              <text x="192" y="32" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="252" y="32">Blue Screen</text>
              <text class="gauge-label" x="252" y="48">BSOD errors</text>
              <text class="gauge-label" x="252" y="60">Unexpected crashes</text>
            </g>

            <g id="issue-overheat" class="issue-card" data-issue="overheat">
              <rect x="344" y="10" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="354" y="18" width="20" height="20" rx="4"/>
              <text x="364" y="32" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="424" y="32">Overheating</text>
              <text class="gauge-label" x="424" y="48">High temperatures</text>
              <text class="gauge-label" x="424" y="60">Fan noise</text>
            </g>

            <g id="issue-nodisplay" class="issue-card" data-issue="nodisplay">
              <rect x="516" y="10" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="526" y="18" width="20" height="20" rx="4"/>
              <text x="536" y="32" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="596" y="32">No Display</text>
              <text class="gauge-label" x="596" y="48">Monitor blank</text>
              <text class="gauge-label" x="596" y="60">GPU not detected</text>
            </g>

            <g id="issue-slow" class="issue-card" data-issue="slow">
              <rect x="0" y="90" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="10" y="98" width="20" height="20" rx="4"/>
              <text x="20" y="112" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="80" y="112">Slow Performance</text>
              <text class="gauge-label" x="80" y="128">Long boot times</text>
              <text class="gauge-label" x="80" y="140">Laggy apps</text>
            </g>

            <g id="issue-loud" class="issue-card" data-issue="loud">
              <rect x="172" y="90" width="160" height="70" rx="6"/>
              <rect class="issue-icon" x="182" y="98" width="20" height="20" rx="4"/>
              <text x="192" y="112" fill="#0959C8" font-size="10" text-anchor="middle" font-weight="700">!</text>
              <text class="issue-title" x="252" y="112">Loud Fan</text>
              <text class="gauge-label" x="252" y="128">Constant noise</text>
              <text class="gauge-label" x="252" y="140">Rattling sounds</text>
            </g>
          </g>

          <!-- Detail Overlay -->
          <g class="detail-overlay" id="detailOverlay">
            <rect x="30" y="380" width="940" height="160" rx="8"/>
            <text class="detail-heading" id="detailHeading" x="50" y="408">Issue Details</text>
            <text class="detail-body" id="detailSymptoms" x="50" y="428">Symptoms:</text>
            <text class="detail-body" id="detailCauses" x="50" y="448">Causes:</text>
            <text class="detail-body" id="detailSolutions" x="50" y="468">Solutions:</text>
            <rect class="optimize-btn-bg" x="800" y="480" width="140" height="32" rx="6" id="optimizeBtn"/>
            <text class="optimize-btn-text" x="870" y="501">Run Optimize</text>
          </g>

          <!-- Beep Code Display -->
          <g class="beep-code" transform="translate(580, 200)">
            <rect x="0" y="0" width="390" height="150" rx="6"/>
            <text class="legend-title" x="195" y="18" text-anchor="middle">POST Beep Codes</text>
            <text class="beep-text" x="16" y="36">1 short: System OK</text>
            <text class="beep-text" x="16" y="52">1 long: Memory error</text>
            <text class="beep-text" x="16" y="68">1 long + 2 short: Video error</text>
            <text class="beep-text" x="16" y="84">Continuous: PSU issue</text>
            <text class="beep-text" x="16" y="100">Repeating short: No POST</text>
            <rect class="beep-code" id="beepDisplay" x="16" y="112" width="358" height="24" rx="4"/>
            <text class="beep-text" id="beepText" x="195" y="129" text-anchor="middle" fill="var(--text-secondary)">No beep codes detected</text>
          </g>

          <!-- Scan Line -->
          <line class="scan-line" id="scanLine" x1="30" y1="360" x2="970" y2="360"/>
        </svg>
      </div>
      <figcaption class="visually-hidden">Diagnostic dashboard with CPU temp, fan speed, voltage, and memory gauges, plus six common issue cards.</figcaption>
    </figure>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to run diagnostic scan</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play diagnostic scan">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause scan" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset diagnostics" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installing an OS Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">Installing an OS</h1>
      <p class="diagram-subtitle">Step-by-step OS installation wizard &mdash; from bootable USB to desktop</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive OS installation wizard with stages and progress bar">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="22">OS Installation Wizard</text>

          <!-- Monitor -->
          <g transform="translate(280, 30)">
            <rect class="monitor-frame" x="0" y="0" width="440" height="310" rx="8"/>
            <rect class="monitor-screen" x="8" y="8" width="424" height="284" rx="4"/>
            <rect class="monitor-stand" x="180" y="310" width="80" height="20" rx="2"/>
            <rect class="monitor-stand" x="140" y="330" width="160" height="10" rx="3"/>

            <!-- Installation Wizard Window -->
            <rect class="wizard-window" x="30" y="30" width="380" height="250" rx="6"/>
            <!-- Header bar -->
            <rect class="wizard-header" x="30" y="30" width="380" height="28" rx="6"/>
            <rect class="wizard-header" x="30" y="50" width="380" height="8"/>
            <text class="wizard-title" x="220" y="50" text-anchor="middle">Windows Setup</text>

            <!-- Stage content area -->
            <g id="wizardContent">
              <!-- Select Language -->
              <g class="stage-content" id="stage-0">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="100" text-anchor="middle" font-weight="700">Windows Setup</text>
                <text class="wizard-text-secondary" x="220" y="120" text-anchor="middle">Language to install: English (United States)</text>
                <text class="wizard-text-secondary" x="220" y="140" text-anchor="middle">Time and currency format: English (United States)</text>
                <text class="wizard-text-secondary" x="220" y="160" text-anchor="middle">Keyboard layout: US</text>
                <rect class="install-icon" x="160" y="175" width="120" height="30" rx="4"/>
                <text class="wizard-text" x="220" y="195" text-anchor="middle" fill="#0959C8" font-weight="700">Next</text>
              </g>

              <!-- Install Now -->
              <g class="stage-content" id="stage-1" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="110" text-anchor="middle" font-weight="700">Windows</text>
                <text class="wizard-text-secondary" x="220" y="130" text-anchor="middle">Click "Install Now" to begin</text>
                <rect class="install-icon" x="160" y="150" width="120" height="30" rx="4"/>
                <text class="wizard-text" x="220" y="170" text-anchor="middle" fill="#0959C8" font-weight="700">Install Now</text>
                <text class="wizard-text-secondary" x="220" y="210" text-anchor="middle">Repair your computer</text>
              </g>

              <!-- License -->
              <g class="stage-content" id="stage-2" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="100" text-anchor="middle" font-weight="700">License Terms</text>
                <text class="wizard-text-secondary" x="60" y="125">Microsoft Software License Terms</text>
                <rect x="60" y="135" width="310" height="70" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
                <text x="70" y="155" fill="var(--text-muted)" font-size="7">This is a summary of the license terms...</text>
                <text x="70" y="170" fill="var(--text-muted)" font-size="7">By continuing, you accept the terms.</text>
                <rect class="install-icon" x="160" y="220" width="120" height="24" rx="4"/>
                <text class="wizard-text" x="220" y="237" text-anchor="middle" fill="#0959C8" font-weight="700">Accept</text>
              </g>

              <!-- Drive Selection -->
              <g class="stage-content" id="stage-3" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="100" text-anchor="middle" font-weight="700">Where to install Windows?</text>
                <rect x="60" y="110" width="310" height="30" rx="3" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="0.8"/>
                <text x="70" y="130" fill="#10B981" font-size="9" font-weight="600">Drive 0: NVMe SSD (238 GB)</text>
                <rect x="60" y="145" width="310" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
                <text x="70" y="165" fill="var(--text-muted)" font-size="8">Drive 1: SATA HDD (931 GB)</text>
                <text class="wizard-text-secondary" x="220" y="210" text-anchor="middle">Total available: 1.1 TB</text>
                <rect class="install-icon" x="160" y="225" width="120" height="24" rx="4"/>
                <text class="wizard-text" x="220" y="241" text-anchor="middle" fill="#0959C8" font-weight="700">Next</text>
              </g>

              <!-- Partitioning -->
              <g class="stage-content" id="stage-4" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="100" text-anchor="middle" font-weight="700">Drive Partitions</text>
                <rect x="60" y="110" width="310" height="24" rx="3" fill="rgba(9,89,200,0.1)" stroke="#0959C8" stroke-width="0.8"/>
                <text x="70" y="127" fill="#0959C8" font-size="8" font-weight="600">Partition 1: System Reserved (100 MB)</text>
                <rect x="60" y="137" width="310" height="24" rx="3" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="0.8"/>
                <text x="70" y="154" fill="#10B981" font-size="8" font-weight="600">Partition 2: Primary (237.9 GB)</text>
                <text class="wizard-text-secondary" x="220" y="200" text-anchor="middle">Click New / Format / Delete to manage</text>
                <rect class="install-icon" x="160" y="215" width="120" height="24" rx="4"/>
                <text class="wizard-text" x="220" y="231" text-anchor="middle" fill="#0959C8" font-weight="700">Format</text>
              </g>

              <!-- Copying Files -->
              <g class="stage-content" id="stage-5" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="100" text-anchor="middle" font-weight="700">Installing Windows</text>
                <text class="wizard-text-secondary" x="220" y="120" text-anchor="middle">Copying files...</text>
                <rect class="progress-bar-bg" x="80" y="140" width="280" height="20" rx="4"/>
                <rect class="progress-bar-fill" id="copyProgress" x="82" y="142" width="0" height="16" rx="3"/>
                <text class="progress-label" id="copyPercent" x="220" y="180" text-anchor="middle">0%</text>
                <text class="wizard-text-secondary" x="220" y="210" text-anchor="middle">Please wait while we copy files</text>
              </g>

              <!-- Reboot -->
              <g class="stage-content" id="stage-6" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="110" text-anchor="middle" font-weight="700">Restart Required</text>
                <text class="wizard-text-secondary" x="220" y="135" text-anchor="middle">Windows will restart automatically</text>
                <rect class="install-icon" x="160" y="155" width="120" height="30" rx="4"/>
                <text class="wizard-text" x="220" y="175" text-anchor="middle" fill="#0959C8" font-weight="700">Restart Now</text>
                <text class="wizard-text-secondary" x="220" y="215" text-anchor="middle">Countdown: 10 seconds</text>
              </g>

              <!-- Setup Complete -->
              <g class="stage-content" id="stage-7" display="none">
                <rect x="50" y="70" width="340" height="190" rx="4" fill="transparent"/>
                <text class="wizard-text" x="220" y="105" text-anchor="middle" font-weight="700" fill="#10B981">Setup Complete</text>
                <text class="wizard-text-secondary" x="220" y="130" text-anchor="middle">Windows is ready!</text>
                <text class="wizard-text-secondary" x="220" y="150" text-anchor="middle">Finalizing settings...</text>
                <rect class="progress-bar-bg" x="120" y="170" width="200" height="8" rx="4"/>
                <rect class="progress-bar-fill" x="122" y="172" width="196" height="4" rx="2"/>
                <text class="wizard-text-secondary" x="220" y="210" text-anchor="middle">Welcome to your new PC</text>
              </g>
            </g>
          </g>

          <!-- Stage Timeline -->
          <g transform="translate(30, 380)">
            <text class="diagram-chip-label" x="0" y="0" text-anchor="start">Installation Stages</text>
            <g id="stage-nodes">
              <rect class="stage-node" id="stagenode-0" x="0" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="45" y="30">Boot USB</text>
              <path class="stage-connector" id="stageconn-0" d="M90,26 L130,26"/>
              <rect class="stage-node" id="stagenode-1" x="130" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="175" y="30">Language</text>
              <path class="stage-connector" id="stageconn-1" d="M220,26 L260,26"/>
              <rect class="stage-node" id="stagenode-2" x="260" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="305" y="30">Install</text>
              <path class="stage-connector" id="stageconn-2" d="M350,26 L390,26"/>
              <rect class="stage-node" id="stagenode-3" x="390" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="435" y="30">License</text>
              <path class="stage-connector" id="stageconn-3" d="M480,26 L520,26"/>
              <rect class="stage-node" id="stagenode-4" x="520" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="565" y="30">Drives</text>
              <path class="stage-connector" id="stageconn-4" d="M610,26 L650,26"/>
              <rect class="stage-node" id="stagenode-5" x="650" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="695" y="30">Partition</text>
              <path class="stage-connector" id="stageconn-5" d="M740,26 L780,26"/>
              <rect class="stage-node" id="stagenode-6" x="780" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="825" y="30">Copy</text>
              <path class="stage-connector" id="stageconn-6" d="M870,26 L910,26"/>
              <rect class="stage-node" id="stagenode-7" x="910" y="14" width="90" height="24" rx="4"/>
              <text class="stage-node-text" x="955" y="30">Done</text>
            </g>
            <text x="0" y="60" fill="var(--text-muted)" font-size="8" font-family="var(--font-body)" font-style="italic">Click a stage name to see details</text>
          </g>

          <!-- Overall progress -->
          <g transform="translate(30, 470)">
            <rect class="progress-bar-bg" x="0" y="0" width="940" height="16" rx="4"/>
            <rect class="progress-bar-fill" id="overallProgress" x="2" y="2" width="0" height="12" rx="3"/>
            <text class="progress-label" x="470" y="13" text-anchor="middle" id="overallProgressText">0% — Ready</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">OS installation stages: Boot from USB, Language Select, Install Now, License, Drive Selection, Partitioning, Copying Files, Reboot, Setup Complete.</figcaption>
    </figure>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to run through OS installation</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play OS installation sequence">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset installation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU Installation — Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#diagram">Skip to diagram</a>
  <div class="diagram-wrapper" id="diagram" role="application" aria-label="CPU Installation interactive diagram">
    <div class="diagram-header">
      <h1 class="diagram-title">CPU Installation</h1>
      <p class="diagram-subtitle">Follow the 4-step process for installing a CPU safely</p>
    </div>
    <div class="controls" role="toolbar" aria-label="Animation controls">
      <button class="ctrl-btn" id="playBtn" aria-label="Run CPU installation animation">&#9654; Play</button>
      <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation">&#9646;&#9646; Pause</button>
      <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation">&#8634; Reset</button>
      <span class="step-indicator" id="stepIndicator" aria-live="polite">Step 1 of 4</span>
    </div>
    <div class="canvas-container">
      <canvas id="cpuCanvas" width="900" height="500" role="img" aria-label="CPU socket and chip installation animation"></canvas>
      <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true" style="display:none;"></div>
    </div>
    <div class="steps-panel" role="list" aria-label="Installation steps">
      <button class="step-btn" data-step="0" role="listitem"><span class="step-num">1</span> Align</button>
      <button class="step-btn" data-step="1" role="listitem"><span class="step-num">2</span> Place</button>
      <button class="step-btn" data-step="2" role="listitem"><span class="step-num">3</span> Secure</button>
      <button class="step-btn" data-step="3" role="listitem"><span class="step-num">4</span> Thermal Paste</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

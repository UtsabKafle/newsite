<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Cables Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">Connecting Cables</h1>
      <p class="diagram-subtitle">Color-coded cable management &mdash; click any cable to highlight its path</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive cable connection diagram with color-coded cables on a motherboard">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="22">Cable Connections &mdash; Motherboard Wiring Diagram</text>

          <!-- Motherboard -->
          <rect class="mobo-base" x="60" y="80" width="500" height="400" rx="4"/>
          <!-- CPU Socket -->
          <rect x="100" y="100" width="100" height="100" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <text x="150" y="155" fill="rgba(255,255,255,0.15)" font-size="7" text-anchor="middle" font-family="var(--font-body)">CPU</text>
          <!-- RAM slots -->
          <rect x="220" y="90" width="130" height="20" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
          <rect x="220" y="116" width="130" height="20" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
          <text x="285" y="106" fill="rgba(255,255,255,0.15)" font-size="6" text-anchor="middle">DIMM</text>

          <!-- 24-pin ATX connector -->
          <g id="cable-group-24pin" class="cable-group">
            <rect class="connector connector-24pin" x="80" y="380" width="60" height="80" rx="3"/>
            <text x="110" y="410" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">24-pin</text>
            <text x="110" y="420" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">ATX</text>
            <path class="cable cable-24pin" id="cable-24pin" d="M80,420 L20,420 L20,540 L300,540"/>
            <text x="120" y="555" fill="#0959C8" font-size="7" font-family="var(--font-body)" font-weight="600">24-pin ATX (Main Power)</text>
          </g>

          <!-- 8-pin CPU connector -->
          <g id="cable-group-8pin" class="cable-group">
            <rect class="connector connector-8pin" x="100" y="80" width="40" height="30" rx="3"/>
            <text x="120" y="98" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">8pin</text>
            <path class="cable cable-8pin" id="cable-8pin" d="M120,60 L120,30 L40,30 L40,540 L300,540"/>
            <text x="120" y="575" fill="#E44" font-size="7" font-family="var(--font-body)" font-weight="600">8-pin CPU Power</text>
          </g>

          <!-- SATA data -->
          <g id="cable-group-sata-data" class="cable-group">
            <rect class="connector connector-sata-data" x="440" y="210" width="40" height="20" rx="3"/>
            <text x="460" y="223" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">SATA</text>
            <path class="cable cable-sata-data" id="cable-sata-data" d="M440,220 L600,220 L620,300"/>
            <text x="590" y="280" fill="#EAA00A" font-size="7" font-family="var(--font-body)" font-weight="600">SATA Data</text>
          </g>

          <!-- SATA power -->
          <g id="cable-group-sata-power" class="cable-group">
            <rect class="connector connector-sata-power" x="440" y="250" width="40" height="20" rx="3"/>
            <text x="460" y="263" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">SATA</text>
            <path class="cable cable-sata-power" id="cable-sata-power" d="M440,260 L580,260 L580,340"/>
            <text x="580" y="355" fill="#F80" font-size="7" font-family="var(--font-body)" font-weight="600">SATA Power</text>
          </g>

          <!-- Front panel -->
          <g id="cable-group-front" class="cable-group">
            <rect class="connector connector-front" x="250" y="320" width="80" height="30" rx="3"/>
            <text x="290" y="340" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">F_PANEL</text>
            <path class="cable cable-front-panel" id="cable-front-panel" d="M330,335 L400,335 L400,460 L560,460"/>
            <text x="480" y="450" fill="#10B981" font-size="7" font-family="var(--font-body)" font-weight="600">Front Panel</text>
          </g>

          <!-- USB header -->
          <g id="cable-group-usb" class="cable-group">
            <rect class="connector connector-usb" x="370" y="340" width="60" height="24" rx="3"/>
            <text x="400" y="356" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">USB</text>
            <path class="cable cable-usb" id="cable-usb" d="M430,352 L520,352 L520,500 L580,500"/>
            <text x="520" y="520" fill="#A855F7" font-size="7" font-family="var(--font-body)" font-weight="600">USB Header</text>
          </g>

          <!-- Audio -->
          <g id="cable-group-audio" class="cable-group">
            <rect class="connector connector-audio" x="370" y="380" width="60" height="24" rx="3"/>
            <text x="400" y="396" fill="rgba(255,255,255,0.3)" font-size="6" text-anchor="middle">AUDIO</text>
            <path class="cable cable-audio" id="cable-audio" d="M430,392 L560,392 L560,540"/>
            <text x="560" y="555" fill="#EC4899" font-size="7" font-family="var(--font-body)" font-weight="600">Audio Header</text>
          </g>

          <!-- Cable routing behind tray -->
          <path class="routing-path" d="M60,400 L20,400 L20,30 L580,30 L580,540 L60,540"/>

          <!-- Legend -->
          <g transform="translate(700, 80)">
            <text class="diagram-chip-label" x="0" y="0" text-anchor="start">Cable Legend</text>
            <rect x="0" y="16" width="14" height="14" rx="2" fill="#0959C8"/>
            <text x="20" y="27" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">24-pin ATX</text>
            <rect x="0" y="36" width="14" height="14" rx="2" fill="#E44"/>
            <text x="20" y="47" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">8-pin CPU</text>
            <rect x="0" y="56" width="14" height="14" rx="2" fill="#EAA00A"/>
            <text x="20" y="67" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">SATA Data</text>
            <rect x="0" y="76" width="14" height="14" rx="2" fill="#F80"/>
            <text x="20" y="87" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">SATA Power</text>
            <rect x="0" y="96" width="14" height="14" rx="2" fill="#10B981"/>
            <text x="20" y="107" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">Front Panel</text>
            <rect x="0" y="116" width="14" height="14" rx="2" fill="#A855F7"/>
            <text x="20" y="127" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">USB Header</text>
            <rect x="0" y="136" width="14" height="14" rx="2" fill="#EC4899"/>
            <text x="20" y="147" fill="var(--text-secondary)" font-size="9" font-family="var(--font-body)">Audio Header</text>
            <text x="0" y="175" fill="var(--text-muted)" font-size="8" font-family="var(--font-body)" font-style="italic">Click any cable to highlight</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">Seven color-coded cables connecting a motherboard: 24-pin ATX, 8-pin CPU, SATA data, SATA power, front panel, USB, and audio.</figcaption>
    </figure>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to see cables connect sequentially</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play cable connection sequence">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

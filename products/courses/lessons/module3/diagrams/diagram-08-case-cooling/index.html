<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case &amp; Cooling Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 3 &middot; Computer Assembly</div>
      <h1 class="diagram-title">Case &amp; Cooling</h1>
      <p class="diagram-subtitle">Airflow through a computer case &mdash; front intake, CPU cooler, and rear exhaust</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive computer case diagram showing airflow paths and internal components">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glowStrong"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0959C8" opacity="0.5"/></marker>
          </defs>
          <rect width="1000" height="600" fill="#0A0E17" rx="12"/>
          <text class="diagram-chip-label" x="500" y="25">Computer Case &mdash; Side Panel View</text>

          <!-- Case outer frame -->
          <rect class="case-box" x="40" y="40" width="920" height="500" rx="8"/>
          <rect class="glass-panel" x="50" y="50" width="900" height="480" rx="4"/>

          <!-- Motherboard tray -->
          <rect class="motherboard-tray" x="120" y="70" width="580" height="350" rx="4"/>
          <text x="410" y="82" fill="rgba(255,255,255,0.2)" font-size="8" font-family="var(--font-body)" text-anchor="middle">Motherboard Tray</text>

          <!-- Motherboard outline -->
          <rect x="140" y="90" width="200" height="240" rx="2" fill="rgba(9,89,200,0.03)" stroke="rgba(9,89,200,0.12)" stroke-width="1"/>
          <text x="240" y="100" fill="rgba(255,255,255,0.15)" font-size="7" font-family="var(--font-body)" text-anchor="middle">Motherboard</text>

          <!-- CPU socket area -->
          <rect x="200" y="140" width="80" height="80" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

          <!-- CPU Air Cooler (tower heatsink) -->
          <g id="component-cpu-cooler" class="component-group" data-component="cpu-cooler">
            <rect class="cpu-heatsink" x="210" y="150" width="60" height="50" rx="2"/>
            <rect class="cpu-heatsink-fin" x="212" y="152" width="56" height="6" rx="1"/>
            <rect class="cpu-heatsink-fin" x="212" y="160" width="56" height="6" rx="1"/>
            <rect class="cpu-heatsink-fin" x="212" y="168" width="56" height="6" rx="1"/>
            <rect class="cpu-heatsink-fin" x="212" y="176" width="56" height="6" rx="1"/>
            <rect class="cpu-heatsink-fin" x="212" y="184" width="56" height="6" rx="1"/>
            <!-- Tower fan on heatsink -->
            <g class="fan-spin-fast" transform="translate(240, 200)">
              <rect class="heatsink-fan" x="-24" y="-8" width="48" height="16" rx="4"/>
              <line x1="-16" y1="0" x2="16" y2="0" stroke="rgba(9,89,200,0.4)" stroke-width="1"/>
            </g>
            <text class="component-name" x="240" y="260">CPU Air Cooler</text>
            <text class="component-desc" x="240" y="272">Tower heatsink + fan</text>
          </g>

          <!-- RAM slots -->
          <rect x="290" y="165" width="40" height="12" rx="1" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <rect x="290" y="180" width="40" height="12" rx="1" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

          <!-- Chipset -->
          <rect x="160" y="220" width="30" height="30" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

          <!-- PSU Bay -->
          <g id="component-psu" class="component-group" data-component="psu">
            <rect class="psu-bay" x="120" y="380" width="200" height="80" rx="4"/>
            <rect x="130" y="390" width="180" height="60" rx="3" fill="#111" stroke="#333" stroke-width="1"/>
            <text class="component-name" x="220" y="420">PSU</text>
            <text class="component-desc" x="220" y="435">Power Supply Unit</text>
            <g transform="translate(260,400)">
              <rect x="0" y="0" width="30" height="12" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
              <rect x="0" y="16" width="30" height="12" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
              <rect x="0" y="32" width="30" height="12" rx="2" fill="#222" stroke="#444" stroke-width="0.5"/>
            </g>
          </g>

          <!-- Drive Cage -->
          <g id="component-drives" class="component-group" data-component="drives">
            <rect class="drive-cage" x="450" y="360" width="240" height="110" rx="4"/>
            <rect x="460" y="370" width="100" height="30" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
            <text x="510" y="388" fill="rgba(255,255,255,0.3)" font-size="7" font-family="var(--font-body)" text-anchor="middle">SSD</text>
            <rect x="460" y="410" width="100" height="30" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
            <text x="510" y="428" fill="rgba(255,255,255,0.3)" font-size="7" font-family="var(--font-body)" text-anchor="middle">HDD</text>
            <text class="component-name" x="570" y="450">Drive Cages</text>
            <text class="component-desc" x="570" y="462">Storage drives</text>
          </g>

          <!-- Front Fans (intake) -->
          <g id="component-front-fans" class="component-group" data-component="front-fans">
            <g class="fan-spin" transform="translate(80, 160)">
              <rect class="fan-blade" x="-30" y="-30" width="60" height="60" rx="30"/>
              <circle class="fan-center" cx="0" cy="0" r="8"/>
              <line x1="-20" y1="0" x2="20" y2="0" stroke="rgba(9,89,200,0.3)" stroke-width="1"/>
              <line x1="0" y1="-20" x2="0" y2="20" stroke="rgba(9,89,200,0.3)" stroke-width="1"/>
            </g>
            <g class="fan-spin" transform="translate(80, 260)">
              <rect class="fan-blade" x="-30" y="-30" width="60" height="60" rx="30"/>
              <circle class="fan-center" cx="0" cy="0" r="8"/>
              <line x1="-20" y1="0" x2="20" y2="0" stroke="rgba(9,89,200,0.3)" stroke-width="1"/>
              <line x1="0" y1="-20" x2="0" y2="20" stroke="rgba(9,89,200,0.3)" stroke-width="1"/>
            </g>
            <text class="component-name" x="80" y="320">Front Fans</text>
            <text class="component-desc" x="80" y="332">Intake (×2)</text>
          </g>

          <!-- Top Fans (exhaust) -->
          <g id="component-top-fans" class="component-group" data-component="top-fans">
            <g class="fan-spin" transform="translate(350, 58)">
              <rect class="fan-blade" x="-24" y="-24" width="48" height="48" rx="24"/>
              <circle class="fan-center" cx="0" cy="0" r="6"/>
            </g>
            <g class="fan-spin" transform="translate(440, 58)">
              <rect class="fan-blade" x="-24" y="-24" width="48" height="48" rx="24"/>
              <circle class="fan-center" cx="0" cy="0" r="6"/>
            </g>
            <text class="component-name" x="395" y="44">Top Fans</text>
            <text class="component-desc" x="395" y="106">Exhaust (×2)</text>
          </g>

          <!-- Rear Fan (exhaust) -->
          <g id="component-rear-fan" class="component-group" data-component="rear-fan">
            <g class="fan-spin" transform="translate(690, 170)">
              <rect class="fan-blade" x="-24" y="-24" width="48" height="48" rx="24"/>
              <circle class="fan-center" cx="0" cy="0" r="6"/>
            </g>
            <text class="component-name" x="690" y="240">Rear Fan</text>
            <text class="component-desc" x="690" y="252">Exhaust</text>
          </g>

          <!-- Airflow Arrows -->
          <g id="airflow-arrows">
            <!-- Front intake arrows -->
            <line class="air-arrow" x1="50" y1="160" x2="120" y2="160" marker-end="url(#arrowHead)"/>
            <line class="air-arrow" x1="50" y1="260" x2="120" y2="260" marker-end="url(#arrowHead)"/>

            <!-- Flow across motherboard -->
            <path class="air-arrow" d="M200,200 L350,200" marker-end="url(#arrowHead)"/>

            <!-- Flow through CPU cooler -->
            <path class="air-arrow" d="M240,170 L240,120 L690,120 L690,146" marker-end="url(#arrowHead)"/>

            <!-- Rear exhaust -->
            <line class="air-arrow" x1="690" y1="170" x2="940" y2="170" marker-end="url(#arrowHead)"/>
          </g>

          <!-- Air Particles -->
          <g id="air-particles">
            <circle class="air-particle" cx="0" cy="0" r="3" filter="url(#glow)">
              <animateMotion dur="4s" repeatCount="indefinite" path="M50,160 L120,160 L200,200 L240,200 L240,120 L690,120 L690,170 L940,170"/>
            </circle>
            <circle class="air-particle" cx="0" cy="0" r="3" filter="url(#glow)">
              <animateMotion dur="4.5s" repeatCount="indefinite" begin="0.5s" path="M50,260 L120,260 L200,260 L240,260 L240,120 L690,120 L690,170 L940,170"/>
            </circle>
            <circle class="air-particle" cx="0" cy="0" r="2.5" filter="url(#glow)">
              <animateMotion dur="5s" repeatCount="indefinite" begin="1s" path="M50,160 L120,160 L200,200 L240,200 L240,120 L690,120 L690,170 L940,170"/>
            </circle>
            <circle class="air-particle" cx="0" cy="0" r="2.5" filter="url(#glow)">
              <animateMotion dur="3.8s" repeatCount="indefinite" begin="1.5s" path="M50,260 L120,260 L200,260 L240,260 L240,120 L690,120 L690,170 L940,170"/>
            </circle>
            <circle class="air-particle" cx="0" cy="0" r="3" filter="url(#glow)">
              <animateMotion dur="5.5s" repeatCount="indefinite" begin="2s" path="M50,160 L120,160 L200,200 L240,200 L240,120 L690,120 L690,170 L940,170"/>
            </circle>
          </g>

          <!-- Legend -->
          <g transform="translate(40, 550)">
            <text class="legend-title" x="0" y="0">Airflow Direction</text>
            <line class="air-arrow" x1="0" y1="16" x2="40" y2="16"/>
            <text class="legend-text" x="48" y="20">Airflow path</text>
            <circle class="legend-dot" cx="200" cy="16" r="4" fill="var(--brand-primary)"/>
            <text class="legend-text" x="212" y="20">Air particle</text>
            <rect x="340" y="10" width="12" height="12" rx="6" fill="rgba(9,89,200,0.15)" stroke="var(--brand-primary)" stroke-width="0.8"/>
            <text class="legend-text" x="358" y="20">Fan</text>
            <text class="legend-text" x="500" y="20" font-style="italic">Click any component for details</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">Animation: Air particles flow from front intake fans through the CPU cooler to rear exhaust fan, showing proper case airflow.</figcaption>
    </figure>
    <div class="info-panel" id="infoPanel" role="status" aria-live="polite">
      <div class="info-panel-title" id="infoTitle">Component</div>
      <div class="info-panel-desc" id="infoDesc">Click a component to learn more</div>
    </div>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to see airflow through the case</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play airflow animation">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

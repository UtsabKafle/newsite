<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Devices Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 2 &middot; How Computers Work</div>
      <h1 class="diagram-title">Input Devices</h1>
      <p class="diagram-subtitle">Explore the devices that send data into a computer &mdash; click or tap each one</p>
    </header>
    <figure class="diagram-area" aria-label="Interactive input devices diagram showing keyboard, mouse, microphone, and touchscreen">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0959C8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0959C8" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect width="1000" height="420" fill="#0A0E17" rx="12"/>
          <g id="devices">
            <g id="device-keyboard" class="device-group" tabindex="0" role="button" aria-label="Keyboard input device">
              <rect class="device-bg" x="40" y="40" width="200" height="340" rx="14"/>
              <rect class="keyboard-body" x="60" y="60" width="160" height="100" rx="6"/>
              <g class="keys-grid">
                <rect class="key key-wide" x="65" y="65" width="50" height="14" rx="2"/>
                <rect class="key" x="120" y="65" width="14" height="14" rx="2"/>
                <rect class="key" x="138" y="65" width="14" height="14" rx="2"/>
                <rect class="key" x="156" y="65" width="14" height="14" rx="2"/>
                <rect class="key" x="174" y="65" width="14" height="14" rx="2"/>
                <rect class="key" x="65" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="83" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="101" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="119" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="137" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="155" y="83" width="14" height="14" rx="2"/>
                <rect class="key" x="173" y="83" width="14" height="14" rx="2"/>
                <rect class="key key-wide2" x="65" y="101" width="70" height="14" rx="2"/>
                <rect class="key" x="140" y="101" width="14" height="14" rx="2"/>
                <rect class="key" x="158" y="101" width="14" height="14" rx="2"/>
                <rect class="key" x="176" y="101" width="14" height="14" rx="2"/>
                <rect class="key key-space" x="65" y="119" width="90" height="14" rx="2"/>
                <rect class="key" x="160" y="119" width="14" height="14" rx="2"/>
                <rect class="key" x="178" y="119" width="14" height="14" rx="2"/>
              </g>
              <rect class="keyboard-body" x="60" y="180" width="160" height="100" rx="6"/>
              <g class="keys-grid">
                <rect class="key" x="65" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="83" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="101" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="119" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="137" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="155" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="173" y="185" width="14" height="14" rx="2"/>
                <rect class="key" x="65" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="83" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="101" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="119" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="137" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="155" y="203" width="14" height="14" rx="2"/>
                <rect class="key" x="173" y="203" width="14" height="14" rx="2"/>
                <rect class="key key-wide2" x="65" y="221" width="70" height="14" rx="2"/>
                <rect class="key" x="140" y="221" width="14" height="14" rx="2"/>
                <rect class="key" x="158" y="221" width="14" height="14" rx="2"/>
                <rect class="key" x="176" y="221" width="14" height="14" rx="2"/>
                <rect class="key key-space" x="65" y="239" width="90" height="14" rx="2"/>
                <rect class="key" x="160" y="239" width="14" height="14" rx="2"/>
                <rect class="key" x="178" y="239" width="14" height="14" rx="2"/>
              </g>
              <text class="device-name" x="140" y="310">Keyboard</text>
              <text class="device-arrow" x="140" y="330">&#8594;</text>
            </g>
            <g id="device-mouse" class="device-group" tabindex="0" role="button" aria-label="Mouse input device">
              <rect class="device-bg" x="270" y="40" width="200" height="340" rx="14"/>
              <ellipse class="mouse-body" cx="370" cy="120" rx="30" ry="45"/>
              <line class="mouse-line" x1="370" y1="80" x2="370" y2="160"/>
              <line class="mouse-line" x1="370" y1="120" x2="390" y2="140" stroke-width="2"/>
              <line class="mouse-line" x1="370" y1="120" x2="350" y2="140" stroke-width="2"/>
              <rect class="device-name-bg" x="320" y="185" width="100" height="6" rx="3"/>
              <text class="device-name" x="370" y="310">Mouse</text>
              <text class="device-arrow" x="370" y="330">&#8594;</text>
            </g>
            <g id="device-microphone" class="device-group" tabindex="0" role="button" aria-label="Microphone input device">
              <rect class="device-bg" x="500" y="40" width="200" height="340" rx="14"/>
              <rect class="mic-body" x="575" y="70" width="50" height="80" rx="10"/>
              <rect class="mic-grill" x="580" y="75" width="40" height="30" rx="4"/>
              <line class="mic-line" x1="585" y1="80" x2="615" y2="80"/>
              <line class="mic-line" x1="585" y1="86" x2="615" y2="86"/>
              <line class="mic-line" x1="585" y1="92" x2="615" y2="92"/>
              <line class="mic-line" x1="585" y1="98" x2="615" y2="98"/>
              <rect class="mic-stand" x="597" y="150" width="6" height="30"/>
              <rect class="mic-base" x="580" y="178" width="40" height="6" rx="3"/>
              <text class="device-name" x="600" y="310">Microphone</text>
              <text class="device-arrow" x="600" y="330">&#8594;</text>
            </g>
            <g id="device-touchscreen" class="device-group" tabindex="0" role="button" aria-label="Touchscreen input device">
              <rect class="device-bg" x="730" y="40" width="200" height="340" rx="14"/>
              <rect class="touch-body" x="765" y="70" width="130" height="180" rx="8"/>
              <rect class="touch-screen" x="770" y="75" width="120" height="170" rx="4"/>
              <circle class="touch-dot" cx="830" cy="120" r="15" opacity="0.3"/>
              <circle class="touch-dot" cx="800" cy="180" r="10" opacity="0.2"/>
              <circle class="touch-dot" cx="860" cy="170" r="12" opacity="0.25"/>
              <text class="device-name" x="830" y="310">Touchscreen</text>
              <text class="device-arrow" x="830" y="330">&#8594;</text>
            </g>
          </g>
          <g id="computer-icon" transform="translate(430, 370)">
            <rect class="computer-monitor" x="0" y="0" width="140" height="30" rx="3"/>
            <rect class="computer-monitor-inner" x="4" y="3" width="132" height="24" rx="2"/>
            <text x="70" y="20" fill="#0959C8" font-size="10" font-family="Poppins, sans-serif" font-weight="700" text-anchor="middle">COMPUTER</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">Interactive diagram: click on the keyboard, mouse, microphone, or touchscreen to learn about each input device.</figcaption>
    </figure>
    <div class="info-panel" id="infoPanel" role="status" aria-live="polite">
      <div class="info-panel-header" id="infoTitle">Select a Device</div>
      <p class="info-panel-desc" id="infoDesc">Click on any input device above to learn about it.</p>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play auto-highlight tour of input devices">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play Tour</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause tour" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset tour" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

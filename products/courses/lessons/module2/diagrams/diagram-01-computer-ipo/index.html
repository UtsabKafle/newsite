<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPO Cycle Diagram | Consica Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="page-wrapper" id="main-content" role="main">
    <header class="top-header">
      <div class="section-label">Module 2 &middot; How Computers Work</div>
      <h1 class="diagram-title">The IPO Cycle</h1>
      <p class="diagram-subtitle">Input &rarr; Process &rarr; Output &mdash; the fundamental operation of every computer</p>
    </header>
    <figure class="diagram-area" aria-label="IPO cycle animation showing data flowing from input devices to the CPU for processing and then to output devices">
      <div class="canvas-container" id="canvasContainer">
        <svg class="diagram-svg" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#0959C8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0959C8" stop-opacity="1"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="glowStrong">
              <feGaussianBlur stdDeviation="8" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect width="1000" height="480" fill="#0A0E17" rx="12"/>
          <g id="bgGrid" opacity="0.04">
            <line x1="0" y1="80" x2="1000" y2="80" stroke="#fff" stroke-width="0.5"/>
            <line x1="0" y1="160" x2="1000" y2="160" stroke="#fff" stroke-width="0.5"/>
            <line x1="0" y1="240" x2="1000" y2="240" stroke="#fff" stroke-width="0.5"/>
            <line x1="0" y1="320" x2="1000" y2="320" stroke="#fff" stroke-width="0.5"/>
            <line x1="0" y1="400" x2="1000" y2="400" stroke="#fff" stroke-width="0.5"/>
          </g>
          <g id="stageInput" class="stage-group">
            <rect class="stage-box" x="50" y="140" width="220" height="200" rx="16"/>
            <rect class="stage-box-inner" x="60" y="150" width="200" height="180" rx="12"/>
            <g class="icon-group" transform="translate(160,230)">
              <rect class="icon-keyboard" x="-40" y="-20" width="80" height="40" rx="4"/>
              <rect class="key-row" x="-32" y="-14" width="12" height="6" rx="1"/>
              <rect class="key-row" x="-16" y="-14" width="12" height="6" rx="1"/>
              <rect class="key-row" x="0" y="-14" width="12" height="6" rx="1"/>
              <rect class="key-row" x="16" y="-14" width="12" height="6" rx="1"/>
              <rect class="key-row" x="-32" y="-4" width="12" height="6" rx="1"/>
              <rect class="key-row" x="-16" y="-4" width="12" height="6" rx="1"/>
              <rect class="key-row" x="0" y="-4" width="12" height="6" rx="1"/>
              <rect class="key-row" x="16" y="-4" width="12" height="6" rx="1"/>
              <rect class="key-row" x="-32" y="6" width="40" height="6" rx="1"/>
              <rect class="key-row" x="16" y="6" width="12" height="6" rx="1"/>
            </g>
            <line class="mouse-cable" x1="100" y1="210" x2="130" y2="240"/>
            <ellipse class="mouse-body" cx="90" cy="230" rx="14" ry="20"/>
            <line class="mouse-line" x1="90" y1="215" x2="90" y2="245"/>
            <line class="mouse-line" x1="90" y1="230" x2="100" y2="240" stroke-width="1.5"/>
            <text class="stage-label" x="160" y="290">Input</text>
            <text class="stage-desc" x="160" y="308">Keyboard &amp; Mouse</text>
          </g>
          <g id="arrow1" class="arrow-group">
            <line class="arrow-line" x1="270" y1="240" x2="360" y2="240"/>
            <polygon class="arrow-head" points="360,232 375,240 360,248"/>
            <circle class="data-dot" r="6" fill="#0959C8" filter="url(#glow)"/>
          </g>
          <g id="stageProcess" class="stage-group">
            <rect class="stage-box" x="380" y="100" width="240" height="280" rx="16"/>
            <rect class="stage-box-inner stage-box-process" x="390" y="110" width="220" height="260" rx="12"/>
            <rect class="cpu-chip" x="430" y="170" width="140" height="120" rx="8"/>
            <rect class="cpu-chip-inner" x="440" y="180" width="120" height="100" rx="6"/>
            <text class="cpu-label" x="500" y="210">CPU</text>
            <text class="cpu-sub" x="500" y="228">Processor</text>
            <g class="gear gear1" transform="translate(470,270)">
              <circle class="gear-circle" r="14" stroke="#0959C8" stroke-width="3" fill="none"/>
              <line class="gear-tooth" x1="0" y1="-16" x2="0" y2="-20" stroke="#0959C8" stroke-width="3" stroke-linecap="round"/>
              <line class="gear-tooth" x1="0" y1="16" x2="0" y2="20" stroke="#0959C8" stroke-width="3" stroke-linecap="round"/>
              <line class="gear-tooth" x1="-16" y1="0" x2="-20" y2="0" stroke="#0959C8" stroke-width="3" stroke-linecap="round"/>
              <line class="gear-tooth" x1="16" y1="0" x2="20" y2="0" stroke="#0959C8" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g class="gear gear2" transform="translate(530,260)">
              <circle class="gear-circle" r="10" stroke="#0959C8" stroke-width="2.5" fill="none"/>
              <line class="gear-tooth" x1="0" y1="-12" x2="0" y2="-15" stroke="#0959C8" stroke-width="2.5" stroke-linecap="round"/>
              <line class="gear-tooth" x1="0" y1="12" x2="0" y2="15" stroke="#0959C8" stroke-width="2.5" stroke-linecap="round"/>
              <line class="gear-tooth" x1="-12" y1="0" x2="-15" y2="0" stroke="#0959C8" stroke-width="2.5" stroke-linecap="round"/>
              <line class="gear-tooth" x1="12" y1="0" x2="15" y2="0" stroke="#0959C8" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <text class="stage-label" x="500" y="80">Process</text>
          </g>
          <g id="arrow2" class="arrow-group">
            <line class="arrow-line" x1="620" y1="240" x2="710" y2="240"/>
            <polygon class="arrow-head" points="710,232 725,240 710,248"/>
            <circle class="data-dot" r="6" fill="#0959C8" filter="url(#glow)"/>
          </g>
          <g id="stageOutput" class="stage-group">
            <rect class="stage-box" x="730" y="140" width="220" height="200" rx="16"/>
            <rect class="stage-box-inner" x="740" y="150" width="200" height="180" rx="12"/>
            <rect class="monitor-body" x="780" y="180" width="70" height="50" rx="4"/>
            <rect class="monitor-screen" x="785" y="185" width="60" height="40" rx="2"/>
            <rect class="monitor-stand" x="805" y="230" width="20" height="10" rx="2"/>
            <rect class="monitor-base" x="795" y="238" width="40" height="4" rx="2"/>
            <rect class="speaker-body" x="860" y="190" width="12" height="30" rx="3"/>
            <ellipse class="speaker-cone" cx="866" cy="205" rx="4" ry="8" fill="none" stroke="#0959C8" stroke-width="1.5"/>
            <line class="sound-wave s1" x1="874" y1="198" x2="878" y2="198" stroke="#0959C8" stroke-width="1.5" stroke-linecap="round"/>
            <line class="sound-wave s2" x1="874" y1="205" x2="880" y2="205" stroke="#0959C8" stroke-width="1.5" stroke-linecap="round"/>
            <line class="sound-wave s3" x1="874" y1="212" x2="878" y2="212" stroke="#0959C8" stroke-width="1.5" stroke-linecap="round"/>
            <text class="stage-label" x="840" y="290">Output</text>
            <text class="stage-desc" x="840" y="308">Monitor &amp; Speaker</text>
          </g>
        </svg>
      </div>
      <figcaption class="visually-hidden">Animation: Data flows from Input (keyboard/mouse) to the CPU for processing, then to Output (monitor/speaker).</figcaption>
    </figure>
    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-text" id="statusText">Press <strong>Play</strong> to start the IPO cycle</span>
    </div>
    <section class="controls-section" aria-label="Animation controls">
      <div class="controls-row">
        <button class="ctrl-btn primary" id="playBtn" aria-label="Play IPO cycle animation">
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
          <span class="btn-label">Play</span>
        </button>
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="4" width="4" height="16" fill="currentColor" rx="1"/><rect x="14" y="4" width="4" height="16" fill="currentColor" rx="1"/></svg>
          <span class="btn-label">Pause</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" aria-label="Reset animation" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12,4V1L8,5l4,4V6c3.31,0,6,2.69,6,6s-2.69,6-6,6s-6-2.69-6-6H4c0,4.42,3.58,8,8,8s8-3.58,8-8S16.42,4,12,4z" fill="currentColor"/></svg>
          <span class="btn-label">Reset</span>
        </button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

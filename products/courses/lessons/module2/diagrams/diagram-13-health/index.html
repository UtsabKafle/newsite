<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Health Monitor - Consica Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="diagram-header">
    <h1 class="diagram-title">Computer Health Monitor</h1>
    <div class="controls" role="toolbar" aria-label="Diagram controls">
      <button id="playBtn" class="ctrl-btn" aria-label="Run health scan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span>Scan</span>
      </button>
      <button id="pauseBtn" class="ctrl-btn" aria-label="Pause scan" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        <span>Pause</span>
      </button>
      <button id="resetBtn" class="ctrl-btn" aria-label="Reset dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        <span>Reset</span>
      </button>
    </div>
    <div class="status-badge" id="statusBadge" role="status" aria-live="polite">Ready</div>
  </header>

  <main id="main-content" class="diagram-container">
    <div class="health-score-card">
      <div class="health-score-label">Overall Health</div>
      <div class="health-score-ring">
        <svg viewBox="0 0 120 120" class="ring-svg">
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--brand)" stroke-width="8" stroke-linecap="round" id="healthRing" stroke-dasharray="326.73" stroke-dashoffset="0" transform="rotate(-90,60,60)"/>
        </svg>
        <div class="health-score-value" id="healthScoreValue">--</div>
      </div>
    </div>

    <div class="gauges-grid">
      <div class="gauge-card" data-gauge="cpu">
        <div class="gauge-label">CPU Temperature</div>
        <div class="gauge-visual">
          <canvas class="gauge-canvas" width="200" height="120" aria-label="CPU temperature gauge"></canvas>
          <div class="gauge-value" id="cpuValue">--°C</div>
        </div>
        <div class="gauge-status" id="cpuStatus">Normal</div>
      </div>
      <div class="gauge-card" data-gauge="memory">
        <div class="gauge-label">Memory Usage</div>
        <div class="gauge-visual">
          <canvas class="gauge-canvas" width="200" height="120" aria-label="Memory usage gauge"></canvas>
          <div class="gauge-value" id="memValue">--%</div>
        </div>
        <div class="gauge-status" id="memStatus">Normal</div>
      </div>
      <div class="gauge-card" data-gauge="disk">
        <div class="gauge-label">Disk Space</div>
        <div class="gauge-visual">
          <canvas class="gauge-canvas" width="200" height="120" aria-label="Disk space gauge"></canvas>
          <div class="gauge-value" id="diskValue">--%</div>
        </div>
        <div class="gauge-status" id="diskStatus">Normal</div>
      </div>
      <div class="gauge-card" data-gauge="battery">
        <div class="gauge-label">Battery Level</div>
        <div class="gauge-visual">
          <canvas class="gauge-canvas" width="200" height="120" aria-label="Battery level gauge"></canvas>
          <div class="gauge-value" id="batValue">--%</div>
        </div>
        <div class="gauge-status" id="batStatus">Normal</div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="issues-panel">
        <div class="issues-header">Issues &amp; Warnings</div>
        <ul class="issues-list" id="issuesList" role="list" aria-label="Detected issues">
          <li class="issue-item placeholder" role="listitem">No issues detected. System healthy.</li>
        </ul>
      </div>
      <div class="scan-progress-panel">
        <div class="scan-progress-header">Scan Progress</div>
        <div class="scan-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="scanTrack">
          <div class="scan-fill" id="scanFill"></div>
        </div>
        <div class="scan-label" id="scanLabel">Waiting to scan...</div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

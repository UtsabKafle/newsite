<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Clock Signal | Consica Labs</title>
<meta name="description" content="Interactive CPU diagram" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" role="application" aria-label="Interactive Clock Signal diagram">
<div id="loading-skeleton" class="loading-skeleton" role="status"><div class="skeleton-spinner"></div><div class="skeleton-bar" style="width:60%"></div><div class="skeleton-bar" style="width:40%"></div><div class="skeleton-bar" style="width:75%"></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-icon">⚠</div><h2>Something went wrong</h2><p id="error-message">An unexpected error occurred loading the diagram.</p><button class="ctrl-btn" onclick="location.reload()">Reload</button></div>
<div id="diagram-container" hidden>
<header class="diagram-header"><div class="header-title"><h1>Clock Signal</h1><p class="header-subtitle">CPU Components</p></div><div class="header-controls"><button id="theme-toggle" class="ctrl-btn theme-btn" aria-label="Toggle theme" title="Toggle theme">◐</button><button id="help-btn" class="ctrl-btn" aria-label="Help" title="How to use">?</button></div></header>
<div id="speed-control" class="speed-control"><label for="speed-slider">Speed: <span id="speed-label">1.00×</span></label><input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1" aria-label="Animation speed" /></div>
<div id="visualization" class="visualization" role="img" aria-label="Interactive Clock Signal visualization"></div>
<div id="info-panel" class="info-panel" role="region" aria-label="Component information" hidden><button id="info-close" class="ctrl-btn info-close" aria-label="Close">✕</button><h3 id="info-title"></h3><p id="info-desc"></p><div id="info-analogy" class="info-analogy"></div><div id="info-detail" class="info-detail"></div></div>
<div id="challenge-section" class="challenge-section"><h2>Knowledge Challenge</h2><div id="challenge-container"></div></div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Challenge completed" hidden><div class="completion-card"><div class="completion-icon">🏆</div><h2>Challenge Complete!</h2><p id="completion-msg">You have mastered this topic.</p><button id="completion-reset" class="ctrl-btn primary-btn">Try Again</button></div></div>
<footer class="diagram-footer"><p>Clock Signal — Interactive Learning Lab</p></footer>
</div></div>
<script src="script.js"></script>
</body>
</html>

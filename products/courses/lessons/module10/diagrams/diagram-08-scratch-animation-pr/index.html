<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scratch Animation Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Scratch Animation Project</h1><p class="app-subtitle">Chat Application</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Scratch Animation Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">CHAT APPLICATION</text><rect x="50" y="65" width="170" height="55" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="135" y="90" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">User A</text><text x="135" y="110" text-anchor="middle" fill="#64748b" font-size="10">Online ●</text><rect x="315" y="65" width="170" height="55" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="90" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">WebSocket Server</text><text x="400" y="110" text-anchor="middle" fill="#64748b" font-size="10">Persistent connection</text><rect x="580" y="65" width="170" height="55" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="665" y="90" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">User B</text><text x="665" y="110" text-anchor="middle" fill="#64748b" font-size="10">Away ○</text><polygon points="220,92 260,92 260,88 270,95 260,102 260,98 220,98" fill="#3b82f6"/><polygon points="485,92 525,92 525,88 535,95 525,102 525,98 485,98" fill="#3b82f6"/><text x="240" y="78" text-anchor="middle" fill="#64748b" font-size="9">connect</text><text x="510" y="78" text-anchor="middle" fill="#64748b" font-size="9">push</text><rect x="50" y="140" width="700" height="100" rx="10" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><rect x="65" y="150" width="200" height="32" rx="6" fill="#3b82f622" stroke="#3b82f6"/><text x="165" y="170" text-anchor="middle" fill="#3b82f6" font-size="11">User A: Hey how are you?</text><rect x="300" y="150" width="200" height="32" rx="6" fill="#22c55e22" stroke="#22c55e"/><text x="400" y="170" text-anchor="middle" fill="#22c55e" font-size="11">User B: Im good you?</text><rect x="150" y="190" width="200" height="32" rx="6" fill="#22c55e22" stroke="#22c55e"/><text x="250" y="210" text-anchor="middle" fill="#22c55e" font-size="11">User B: Need any help?</text><rect x="390" y="190" width="200" height="32" rx="6" fill="#a855f722" stroke="#a855f7"/><text x="490" y="210" text-anchor="middle" fill="#a855f7" font-size="11">📎 File: project-plan.pdf</text><rect x="50" y="260" width="220" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="160" y="282" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Chat Rooms</text><text x="160" y="300" text-anchor="middle" fill="#64748b" font-size="10">3 active rooms</text><rect x="290" y="260" width="220" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="282" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">File Sharing</text><text x="400" y="300" text-anchor="middle" fill="#64748b" font-size="10">12 shared files today</text><rect x="530" y="260" width="220" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="640" y="282" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Notifications</text><text x="640" y="300" text-anchor="middle" fill="#64748b" font-size="10">Push: enabled</text><rect x="200" y="335" width="400" height="44" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="358" text-anchor="middle" fill="var(--pal-text)" font-size="12">Total messages today: 48 | Active users: 2</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="users" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">User System</span><span class="node-cat">Auth</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="messages" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Message System</span><span class="node-cat">Core</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="websocket" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">WebSocket Server</span><span class="node-cat">Network</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="rooms" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Chat Rooms</span><span class="node-cat">Groups</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="files" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">File Sharing</span><span class="node-cat">Media</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="notif" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Notifications</span><span class="node-cat">Alerts</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

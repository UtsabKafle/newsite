<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Internet Explorer Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Internet Explorer Project</h1><p class="app-subtitle">Browser Architecture</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Internet Explorer Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">BROWSER ARCHITECTURE FLOW</text><rect x="60" y="65" width="680" height="34" rx="6" fill="#1e293b" stroke="var(--pal-border)"/><text x="400" y="88" text-anchor="middle" fill="#94a3b8" font-size="12">https://www.example.com/page.html</text><rect x="90" y="115" width="140" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="160" y="140" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">URL Parser</text><rect x="310" y="115" width="140" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="380" y="140" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">DNS Resolver</text><rect x="530" y="115" width="140" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="600" y="140" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">Web Server</text><polygon points="230,135 270,135 270,131 280,138 270,145 270,141 230,141" fill="#3b82f6"/><polygon points="450,135 490,135 490,131 500,138 490,145 490,141 450,141" fill="#3b82f6"/><rect x="90" y="180" width="160" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="170" y="205" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">HTML Parser</text><rect x="310" y="180" width="180" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="205" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">CSSOM + Render Tree</text><rect x="550" y="180" width="140" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="620" y="205" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">Layout</text><polygon points="250,200 290,200 290,196 300,203 290,210 290,206 250,206" fill="#3b82f6"/><polygon points="490,200 530,200 530,196 540,203 530,210 530,206 490,206" fill="#3b82f6"/><rect x="90" y="250" width="180" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="180" y="275" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">JavaScript Engine</text><rect x="340" y="250" width="160" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="420" y="275" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">Paint</text><rect x="560" y="250" width="140" height="40" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="630" y="275" text-anchor="middle" fill="var(--pal-text)" font-size="11" font-weight="600">Composite</text><polygon points="270,270 310,270 310,266 320,273 310,280 310,276 270,276" fill="#3b82f6"/><polygon points="500,270 540,270 540,266 550,273 540,280 540,276 500,276" fill="#3b82f6"/><rect x="520" y="325" width="180" height="34" rx="6" fill="#3b82f622" stroke="#3b82f6"/><text x="610" y="348" text-anchor="middle" fill="#3b82f6" font-size="11">DevTools Inspector</text><rect x="60" y="325" width="200" height="34" rx="6" fill="#22c55e22" stroke="#22c55e"/><text x="160" y="348" text-anchor="middle" fill="#22c55e" font-size="11">localStorage / Cookies</text><rect x="60" y="375" width="300" height="34" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="210" y="398" text-anchor="middle" fill="var(--pal-text)" font-size="11">Total: 1 request / 240ms load time</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="urlbar" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">URL Bar</span><span class="node-cat">Input</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="dns" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">DNS Resolver</span><span class="node-cat">Network</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="parser" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">HTML Parser</span><span class="node-cat">Render</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="renderer" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Render Engine</span><span class="node-cat">Display</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="devtools" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">DevTools</span><span class="node-cat">Debug</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="storage" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Web Storage</span><span class="node-cat">Data</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Website Design Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Website Design Project</h1><p class="app-subtitle">Blog Platform CMS</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Website Design Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">BLOG PLATFORM CMS</text><rect x="60" y="65" width="200" height="34" rx="6" fill="#22c55e22" stroke="#22c55e"/><text x="160" y="88" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Posts: 0 Drafts 3 Published</text><rect x="290" y="65" width="200" height="34" rx="6" fill="#3b82f622" stroke="#3b82f6"/><text x="390" y="88" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">Categories: 4 | Tags: 12</text><rect x="520" y="65" width="180" height="34" rx="6" fill="#a855f722" stroke="#a855f7"/><text x="610" y="88" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="600">Users: 3 Authors</text><rect x="60" y="115" width="680" height="80" rx="10" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="145" fill="var(--pal-text)" font-size="16" font-weight="600">How to Build a Blog Platform</text><text x="100" y="166" fill="#64748b" font-size="12">Posted June 5, 2026 | Category: Tutorial | Tags: web-dev, blogging</text><text x="100" y="186" fill="#64748b" font-size="12">Building a blog platform teaches you full-stack development...</text><rect x="500" y="125" width="60" height="28" rx="4" fill="#22c55e"/><text x="530" y="145" text-anchor="middle" fill="white" font-size="11" font-weight="600">EDIT</text><rect x="570" y="125" width="60" height="28" rx="4" fill="#ef4444"/><text x="600" y="145" text-anchor="middle" fill="white" font-size="11" font-weight="600">DELETE</text><rect x="640" y="125" width="80" height="28" rx="4" fill="#3b82f6"/><text x="680" y="145" text-anchor="middle" fill="white" font-size="11" font-weight="600">VIEW</text><rect x="60" y="210" width="320" height="80" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="235" fill="var(--pal-text)" font-size="13" font-weight="600">Comments (12)</text><text x="100" y="258" fill="#64748b" font-size="12">Jane: Great article! This helped me...</text><text x="100" y="278" fill="#64748b" font-size="12">Mike: Could you explain routing more?</text><rect x="420" y="210" width="320" height="80" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="460" y="235" fill="var(--pal-text)" font-size="13" font-weight="600">Media Library</text><rect x="440" y="248" width="50" height="30" rx="4" fill="#3b82f6"/><text x="465" y="270" text-anchor="middle" fill="white" font-size="11" font-weight="600">IMG</text><rect x="500" y="248" width="50" height="30" rx="4" fill="#22c55e"/><text x="525" y="270" text-anchor="middle" fill="white" font-size="11" font-weight="600">VID</text><rect x="560" y="248" width="50" height="30" rx="4" fill="#eab308"/><text x="585" y="270" text-anchor="middle" fill="white" font-size="11" font-weight="600">DOC</text><rect x="620" y="250" width="100" height="28" rx="4" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="670" y="270" text-anchor="middle" fill="var(--pal-text)" font-size="11">12 files | 45 MB</text><rect x="60" y="305" width="680" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="330" fill="var(--pal-text)" font-size="13" font-weight="600">SEO Preview</text><text x="220" y="330" fill="#3b82f6" font-size="12">How to Build a Blog Platform - Learn Web Dev</text><text x="220" y="348" fill="#64748b" font-size="11">www.example.com/blog/build | A comprehensive guide...</text><rect x="60" y="370" width="180" height="30" rx="6" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="150" y="391" text-anchor="middle" fill="var(--pal-text)" font-size="11">Drafts auto-saved every 30s</text><rect x="270" y="370" width="200" height="30" rx="6" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="370" y="391" text-anchor="middle" fill="var(--pal-text)" font-size="11">Open Graph tags set</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="posts" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">Posts Manager</span><span class="node-cat">Content</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="categories" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Categories and Tags</span><span class="node-cat">Taxonomy</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="comments" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Comments System</span><span class="node-cat">Engagement</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="users" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">User Roles</span><span class="node-cat">Auth</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="media" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Media Library</span><span class="node-cat">Assets</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="seo" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">SEO Tools</span><span class="node-cat">Optimize</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Problem Solving Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Problem Solving Challenge</h1><p class="app-subtitle">Mobile App Development</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Problem Solving Challenge"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">MOBILE APP NAVIGATION</text><rect x="60" y="65" width="680" height="80" rx="10" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="92" fill="var(--pal-text)" font-size="16" font-weight="600">Home Screen</text><text x="100" y="115" fill="#64748b" font-size="12">Welcome back, User! You have 3 new notifications.</text><text x="100" y="135" fill="#64748b" font-size="12">Explore our latest features and updates below.</text><rect x="60" y="160" width="320" height="80" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="185" fill="var(--pal-text)" font-size="13" font-weight="600">Navigation Stack</text><text x="100" y="208" fill="#64748b" font-size="11">Screen 1 → Screen 2 → Screen 3</text><text x="100" y="228" fill="#64748b" font-size="11">Push/pop with animated transitions</text><rect x="420" y="160" width="320" height="80" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="460" y="185" fill="var(--pal-text)" font-size="13" font-weight="600">Tab Bar</text><rect x="440" y="198" width="60" height="28" rx="4" fill="#3b82f6"/><text x="470" y="218" text-anchor="middle" fill="white" font-size="10">Home</text><rect x="508" y="198" width="60" height="28" rx="4" fill="#22c55e"/><text x="538" y="218" text-anchor="middle" fill="white" font-size="10">Search</text><rect x="576" y="198" width="60" height="28" rx="4" fill="#eab308"/><text x="606" y="218" text-anchor="middle" fill="white" font-size="10">Profile</text><rect x="644" y="198" width="60" height="28" rx="4" fill="#a855f7"/><text x="674" y="218" text-anchor="middle" fill="white" font-size="10">Settings</text><rect x="60" y="260" width="320" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="220" y="282" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Touch Gestures</text><text x="220" y="300" text-anchor="middle" fill="#64748b" font-size="10">Tap | Swipe | Pinch | Long-press</text><rect x="420" y="260" width="320" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="580" y="282" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Offline Mode</text><text x="580" y="300" text-anchor="middle" fill="#64748b" font-size="10">Cached data available for offline use</text><rect x="60" y="330" width="320" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="220" y="352" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Push Notifications</text><text x="220" y="370" text-anchor="middle" fill="#64748b" font-size="10">APNs | FCM | Custom preferences</text><rect x="420" y="330" width="200" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="520" y="352" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">iOS HIG / Material</text><text x="520" y="370" text-anchor="middle" fill="#64748b" font-size="10">Platform-specific design</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="nav" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">Navigation Stack</span><span class="node-cat">Routing</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="screens" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Screen Layout</span><span class="node-cat">UI</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="tabs" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Tab Bar</span><span class="node-cat">Navigation</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="gestures" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Touch Gestures</span><span class="node-cat">Input</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="offline" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Offline Mode</span><span class="node-cat">Data</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="push" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Push Notifications</span><span class="node-cat">Alerts</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

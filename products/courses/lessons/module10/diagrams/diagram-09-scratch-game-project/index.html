<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scratch Game Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Scratch Game Project</h1><p class="app-subtitle">REST API Service</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Scratch Game Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">REST API SERVICE</text><rect x="50" y="65" width="220" height="50" rx="8" fill="#3b82f622" stroke="#3b82f6"/><text x="160" y="88" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">GET /api/users</text><text x="160" y="105" text-anchor="middle" fill="#64748b" font-size="10">Retrieve list of users</text><rect x="290" y="65" width="220" height="50" rx="8" fill="#22c55e22" stroke="#22c55e"/><text x="400" y="88" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">POST /api/items</text><text x="400" y="105" text-anchor="middle" fill="#64748b" font-size="10">Create new resource</text><rect x="530" y="65" width="220" height="50" rx="8" fill="#ef444422" stroke="#ef4444"/><text x="640" y="88" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">DELETE /api/items/:id</text><text x="640" y="105" text-anchor="middle" fill="#64748b" font-size="10">Remove resource</text><rect x="50" y="135" width="700" height="60" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="80" y="160" fill="var(--pal-text)" font-size="13" font-weight="600">Middleware Pipeline</text><rect x="70" y="170" width="110" height="20" rx="4" fill="#3b82f6"/><text x="125" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="600">Auth</text><rect x="190" y="170" width="110" height="20" rx="4" fill="#22c55e"/><text x="245" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="600">Logger</text><rect x="310" y="170" width="110" height="20" rx="4" fill="#eab308"/><text x="365" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="600">Validate</text><rect x="430" y="170" width="110" height="20" rx="4" fill="#a855f7"/><text x="485" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="600">Rate Limit</text><rect x="550" y="170" width="120" height="20" rx="4" fill="#06b6d4"/><text x="610" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="600">Compress</text><rect x="50" y="215" width="340" height="70" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="80" y="240" fill="var(--pal-text)" font-size="13" font-weight="600">Database Layer</text><text x="80" y="260" fill="#64748b" font-size="11">Tables: users, items, orders</text><text x="80" y="278" fill="#64748b" font-size="11">Avg query: 12ms</text><rect x="420" y="215" width="330" height="70" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="450" y="240" fill="var(--pal-text)" font-size="13" font-weight="600">Authentication</text><text x="450" y="260" fill="#64748b" font-size="11">JWT tokens | OAuth 2.0</text><text x="450" y="278" fill="#64748b" font-size="11">Token expiry: 24h | Refresh: 7d</text><rect x="50" y="305" width="700" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="80" y="330" fill="var(--pal-text)" font-size="13" font-weight="600">API Documentation</text><text x="260" y="330" fill="#3b82f6" font-size="12">OpenAPI 3.0 | Interactive Swagger UI</text><text x="260" y="348" fill="#64748b" font-size="11">24 endpoints | 3 examples each</text><rect x="200" y="375" width="400" height="30" rx="6" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="395" text-anchor="middle" fill="var(--pal-text)" font-size="11">Status: 200 OK | Rate: 1,240 req/min</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="endpoints" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">API Endpoints</span><span class="node-cat">Routes</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="methods" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">HTTP Methods</span><span class="node-cat">Verbs</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="middleware" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Middleware Layer</span><span class="node-cat">Pipeline</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="database" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Database Layer</span><span class="node-cat">Storage</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="auth" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Authentication</span><span class="node-cat">Security</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="docs" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">API Documentation</span><span class="node-cat">DevEx</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

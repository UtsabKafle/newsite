<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Technology Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Technology Showcase</h1><p class="app-subtitle">DevOps Pipeline</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Technology Showcase"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">DEVOPS PIPELINE</text><rect x="60" y="65" width="120" height="60" rx="8" fill="#3b82f622" stroke="#3b82f6"/><text x="120" y="92" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="600">CODE</text><text x="120" y="112" text-anchor="middle" fill="#64748b" font-size="10">Git / PRs</text><rect x="200" y="65" width="120" height="60" rx="8" fill="#22c55e22" stroke="#22c55e"/><text x="260" y="92" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">BUILD</text><text x="260" y="112" text-anchor="middle" fill="#64748b" font-size="10">Compile / CI</text><rect x="340" y="65" width="120" height="60" rx="8" fill="#eab30822" stroke="#eab308"/><text x="400" y="92" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">TEST</text><text x="400" y="112" text-anchor="middle" fill="#64748b" font-size="10">Unit / E2E</text><rect x="480" y="65" width="120" height="60" rx="8" fill="#a855f722" stroke="#a855f7"/><text x="540" y="92" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="600">DEPLOY</text><text x="540" y="112" text-anchor="middle" fill="#64748b" font-size="10">Staging / Prod</text><rect x="620" y="65" width="120" height="60" rx="8" fill="#06b6d422" stroke="#06b6d4"/><text x="680" y="92" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="600">MONITOR</text><text x="680" y="112" text-anchor="middle" fill="#64748b" font-size="10">Metrics / Logs</text><polygon points="180,95 200,95 200,91 210,98 200,105 200,101 180,101" fill="#3b82f6"/><polygon points="320,95 340,95 340,91 350,98 340,105 340,101 320,101" fill="#3b82f6"/><polygon points="460,95 480,95 480,91 490,98 480,105 480,101 460,101" fill="#3b82f6"/><polygon points="600,95 620,95 620,91 630,98 620,105 620,101 600,101" fill="#3b82f6"/><rect x="60" y="150" width="680" height="70" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="175" fill="var(--pal-text)" font-size="13" font-weight="600">Continuous Integration — Automated checks on every commit</text><text x="100" y="195" fill="#64748b" font-size="11">Lint → Build → Test → Security Scan → Artifact Generation</text><text x="100" y="210" fill="#64748b" font-size="11">Avg build time: 4m 32s | Success rate: 97.3%</text><rect x="60" y="240" width="320" height="70" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="265" fill="var(--pal-text)" font-size="13" font-weight="600">Deployment Pipeline</text><text x="100" y="285" fill="#64748b" font-size="11">Dev → Staging → Production</text><text x="100" y="305" fill="#64748b" font-size="11">Manual approval gate before prod</text><rect x="420" y="240" width="320" height="70" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="460" y="265" fill="var(--pal-text)" font-size="13" font-weight="600">Monitoring & Logging</text><text x="460" y="285" fill="#64748b" font-size="11">CPU: 45% | Memory: 62% | Uptime: 99.9%</text><text x="460" y="305" fill="#64748b" font-size="11">Logs: 1.2 GB/day | Alerts: 3 active</text><rect x="200" y="340" width="400" height="44" rx="8" fill="#3b82f622" stroke="#3b82f6"/><text x="400" y="365" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="600">Continuous Improvement → Feedback → Iterate</text><text x="400" y="380" text-anchor="middle" fill="#64748b" font-size="10">Every incident is an opportunity to improve the system</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="code" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">Code Repository</span><span class="node-cat">Source</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="build" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Build System</span><span class="node-cat">Compile</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="test" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Test Suite</span><span class="node-cat">Quality</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="deploy" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Deployment Pipeline</span><span class="node-cat">Release</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="monitor" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Monitoring & Logging</span><span class="node-cat">Observability</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="iterate" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Continuous Improvement</span><span class="node-cat">Feedback</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

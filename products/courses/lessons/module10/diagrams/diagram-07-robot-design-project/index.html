<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Robot Design Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Robot Design Project</h1><p class="app-subtitle">E-commerce Store</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Robot Design Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">E-COMMERCE STORE FLOW</text><rect x="50" y="65" width="220" height="100" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="160" y="92" text-anchor="middle" fill="var(--pal-text)" font-size="13" font-weight="600">Product Catalog</text><text x="160" y="114" text-anchor="middle" fill="#64748b" font-size="11">Search + Filter</text><text x="160" y="132" text-anchor="middle" fill="#64748b" font-size="11">12 categories</text><text x="160" y="150" text-anchor="middle" fill="#64748b" font-size="11">48 products total</text><rect x="290" y="65" width="220" height="100" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="400" y="92" text-anchor="middle" fill="var(--pal-text)" font-size="13" font-weight="600">Shopping Cart</text><text x="400" y="114" text-anchor="middle" fill="#64748b" font-size="11">3 items | $142.50</text><text x="400" y="132" text-anchor="middle" fill="#64748b" font-size="11">Persists across sessions</text><text x="400" y="150" text-anchor="middle" fill="#64748b" font-size="11">Saved for later: 2 items</text><rect x="530" y="65" width="220" height="100" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="640" y="92" text-anchor="middle" fill="var(--pal-text)" font-size="13" font-weight="600">Reviews</text><text x="640" y="114" text-anchor="middle" fill="#64748b" font-size="11">Avg rating: 4.2 stars</text><text x="640" y="132" text-anchor="middle" fill="#64748b" font-size="11">24 verified reviews</text><text x="640" y="150" text-anchor="middle" fill="#64748b" font-size="11">Most helpful first</text><rect x="80" y="185" width="180" height="50" rx="8" fill="#22c55e22" stroke="#22c55e"/><text x="170" y="210" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">Checkout</text><text x="170" y="228" text-anchor="middle" fill="#64748b" font-size="10">3-step process</text><rect x="300" y="185" width="180" height="50" rx="8" fill="#3b82f622" stroke="#3b82f6"/><text x="390" y="210" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="600">Payment Gateway</text><text x="390" y="228" text-anchor="middle" fill="#64748b" font-size="10">PCI DSS compliant</text><rect x="520" y="185" width="180" height="50" rx="8" fill="#eab30822" stroke="#eab308"/><text x="610" y="210" text-anchor="middle" fill="#eab308" font-size="13" font-weight="600">Order Management</text><text x="610" y="228" text-anchor="middle" fill="#64748b" font-size="10">Track, fulfill, ship</text><polygon points="260,210 280,210 280,206 290,213 280,220 280,216 260,216" fill="#3b82f6"/><polygon points="480,210 500,210 500,206 510,213 500,220 500,216 480,216" fill="#3b82f6"/><rect x="80" y="260" width="180" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="170" y="285" text-anchor="middle" fill="var(--pal-text)" font-size="11">Conversion Rate: 3.2%</text><text x="170" y="303" text-anchor="middle" fill="#64748b" font-size="10">Industry avg: 2.5%</text><rect x="300" y="260" width="180" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="390" y="285" text-anchor="middle" fill="var(--pal-text)" font-size="11">Abandoned Carts: 12</text><text x="390" y="303" text-anchor="middle" fill="#64748b" font-size="10">Recovery rate: 15%</text><rect x="520" y="260" width="180" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="610" y="285" text-anchor="middle" fill="var(--pal-text)" font-size="11">Revenue: $4,280</text><text x="610" y="303" text-anchor="middle" fill="#64748b" font-size="10">Orders: 38 total</text><rect x="200" y="340" width="400" height="44" rx="8" fill="#3b82f622" stroke="#3b82f6"/><text x="400" y="365" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="600">BROWSE → CART → CHECKOUT → PAY → CONFIRM</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="products" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">Product Catalog</span><span class="node-cat">Store</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="cart" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Shopping Cart</span><span class="node-cat">Checkout</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="checkout" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Checkout Flow</span><span class="node-cat">Purchase</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="payment" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Payment Gateway</span><span class="node-cat">Finance</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="orders" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Order Management</span><span class="node-cat">Admin</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="reviews" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Reviews and Ratings</span><span class="node-cat">Social</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

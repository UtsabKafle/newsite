<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Operating System Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" role="application">
<div id="skeleton" class="skeleton" role="status">
<div class="skeleton-shimmer"></div>
<div class="skeleton-header"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
<div class="skeleton-body"><div class="skeleton-block h-64"></div><div class="skeleton-block h-32"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
<div class="error-icon">\u26A0</div>
<h2>Something went wrong</h2>
<p id="error-msg">An unexpected error occurred.</p>
<button onclick="location.reload()" class="btn-primary">Reload</button>
</div>
<div id="main-content" hidden>
<header class="app-header">
<div class="header-top"><div><h1 class="app-title">Operating System Project</h1><p class="app-subtitle">Weather Dashboard</p></div>
<div class="header-controls">
<button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">\uD83C\uDF13</button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"></div>
</div></div>
</header>
<div class="diagram-layout">
<div class="diagram-area">
<div class="svg-container">
<svg id="diagram-svg" viewBox="0 0 800 460" class="diagram-svg" role="img" aria-label="Operating System Project"><g><rect x="20" y="20" width="760" height="420" rx="12" fill="var(--pal-bg)"/><text x="400" y="48" text-anchor="middle" fill="var(--pal-muted)" font-size="11" font-weight="600">WEATHER DASHBOARD</text><rect x="60" y="65" width="550" height="80" rx="10" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="100" y="96" fill="var(--pal-text)" font-size="28" font-weight="700">72°F</text><text x="100" y="122" fill="#64748b" font-size="12">Feels like 68°F | Humidity: 45% | Wind: 12 mph</text><circle cx="510" cy="95" r="26" fill="#eab308" opacity="0.8"/><circle cx="510" cy="95" r="12" fill="#fef08a"/><line x1="510" y1="57" x2="510" y2="65" stroke="#eab308" stroke-width="3"/><line x1="510" y1="125" x2="510" y2="133" stroke="#eab308" stroke-width="3"/><line x1="472" y1="95" x2="480" y2="95" stroke="#eab308" stroke-width="3"/><line x1="540" y1="95" x2="548" y2="95" stroke="#eab308" stroke-width="3"/><text x="510" y="138" text-anchor="middle" fill="#eab308" font-size="11">Sunny</text><rect x="630" y="70" width="120" height="34" rx="6" fill="#ef444422" stroke="#ef4444"/><text x="690" y="93" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">⚠ HEAT ADVISORY</text><rect x="60" y="160" width="125" height="90" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="122" y="184" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Mon</text><text x="122" y="208" text-anchor="middle" fill="#eab308" font-size="18">☀</text><text x="122" y="232" text-anchor="middle" fill="var(--pal-text)" font-size="13">75° / 52°</text><rect x="195" y="160" width="125" height="90" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="257" y="184" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Tue</text><text x="257" y="208" text-anchor="middle" fill="#94a3b8" font-size="18">☁</text><text x="257" y="232" text-anchor="middle" fill="var(--pal-text)" font-size="13">68° / 48°</text><rect x="330" y="160" width="125" height="90" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="392" y="184" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Wed</text><text x="392" y="208" text-anchor="middle" fill="#60a5fa" font-size="18">🌧</text><text x="392" y="232" text-anchor="middle" fill="var(--pal-text)" font-size="13">62° / 45°</text><rect x="465" y="160" width="125" height="90" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="527" y="184" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Thu</text><text x="527" y="208" text-anchor="middle" fill="#94a3b8" font-size="18">☁</text><text x="527" y="232" text-anchor="middle" fill="var(--pal-text)" font-size="13">65° / 50°</text><rect x="600" y="160" width="125" height="90" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="662" y="184" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Fri</text><text x="662" y="208" text-anchor="middle" fill="#eab308" font-size="18">☀</text><text x="662" y="232" text-anchor="middle" fill="var(--pal-text)" font-size="13">70° / 55°</text><rect x="60" y="270" width="320" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="220" y="290" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">API Fetch</text><text x="220" y="308" text-anchor="middle" fill="#64748b" font-size="10">GET /weather?lat=40.71&lon=-74.01</text><rect x="420" y="270" width="140" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="490" y="290" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">Geolocation</text><text x="490" y="308" text-anchor="middle" fill="#64748b" font-size="10">40.71°N 74.01°W</text><rect x="600" y="270" width="140" height="50" rx="8" fill="var(--pal-node-bg)" stroke="var(--pal-node-border)"/><text x="670" y="290" text-anchor="middle" fill="var(--pal-text)" font-size="12" font-weight="600">History</text><text x="670" y="308" text-anchor="middle" fill="#64748b" font-size="10">Avg high: 68°F</text><rect x="60" y="340" width="220" height="34" rx="6" fill="#22c55e22" stroke="#22c55e"/><text x="170" y="363" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Cache: Updated 2 min ago</text><rect x="320" y="340" width="220" height="34" rx="6" fill="#3b82f622" stroke="#3b82f6"/><text x="430" y="363" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">Alerts: 1 active warning</text></g></svg>
</div>
<div class="node-list" role="tablist"><button class="node-btn" role="tab" aria-selected="false" data-node="apifetch" style="--node-color:#3b82f6"><span class="node-indicator"></span><span class="node-name">API Fetch</span><span class="node-cat">Data</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="geoloc" style="--node-color:#22c55e"><span class="node-indicator"></span><span class="node-name">Geolocation</span><span class="node-cat">Input</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="display" style="--node-color:#eab308"><span class="node-indicator"></span><span class="node-name">Weather Display</span><span class="node-cat">UI</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="forecast" style="--node-color:#ef4444"><span class="node-indicator"></span><span class="node-name">Forecast Cards</span><span class="node-cat">UI</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="alerts" style="--node-color:#a855f7"><span class="node-indicator"></span><span class="node-name">Weather Alerts</span><span class="node-cat">Safety</span></button>
<button class="node-btn" role="tab" aria-selected="false" data-node="history" style="--node-color:#06b6d4"><span class="node-indicator"></span><span class="node-name">Weather History</span><span class="node-cat">Analytics</span></button></div>
</div>
<div class="info-panel" id="info-panel" role="tabpanel" aria-live="polite">
<div class="info-placeholder">Click a node to explore</div>
</div>
</div>
<section class="challenge-section">
<h2 class="section-title">Knowledge Check</h2>
<div id="challenge-container" class="challenge-container"></div>
<button id="submit-challenge" class="btn-primary challenge-submit">Submit Answers</button>
</section>
</div>
<div id="completion-overlay" class="completion-overlay" role="alertdialog" aria-modal="true" hidden>
<div class="completion-card">
<div class="completion-icon">\uD83C\uDF89</div>
<h2 class="completion-title">Quiz Complete!</h2>
<p class="completion-score" id="completion-score">0/0</p>
<p class="completion-msg" id="completion-msg">Great effort!</p>
<button id="completion-close" class="btn-primary">Continue</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

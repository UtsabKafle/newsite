<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>WebSockets — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="WebSockets interactive diagram">
<defs>
<marker id="arrow-ws" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l5 10 5-10" fill="#5694E4"/></marker>
<marker id="arrow-ws-green" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l5 10 5-10" fill="#22c55e"/></marker>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">WebSockets — Real-Time Communication</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">Connection Lifecycle: Handshake → Duplex → Close</text>
<g id="ws-lifecycle">
<rect x="50" y="90" width="220" height="130" rx="14" class="ws-node client-node" data-phase="client" tabindex="0" role="button" aria-label="WebSocket Client"/>
<text x="160" y="125" text-anchor="middle" class="ws-label">Client</text>
<text x="160" y="148" text-anchor="middle" class="ws-sub">Browser / App</text>
<text x="160" y="170" text-anchor="middle" class="ws-detail">ws://example.com/chat</text>
<text x="160" y="190" text-anchor="middle" class="ws-detail">Origin: https://app.example</text>
<rect x="620" y="90" width="220" height="130" rx="14" class="ws-node server-node" data-phase="server" tabindex="0" role="button" aria-label="WebSocket Server"/>
<text x="730" y="125" text-anchor="middle" class="ws-label">Server</text>
<text x="730" y="148" text-anchor="middle" class="ws-sub">WebSocket Server</text>
<text x="730" y="170" text-anchor="middle" class="ws-detail">Upgrade: WebSocket</text>
<text x="730" y="190" text-anchor="middle" class="ws-detail">Connection: Upgrade</text>
</g>
<g id="handshake">
<line x1="270" y1="120" x2="620" y2="120" stroke="#5694E4" stroke-width="2.5" marker-end="url(#arrow-ws)"/>
<text x="445" y="112" text-anchor="middle" class="phase-label">① HTTP Upgrade Handshake</text>
<text x="445" y="132" text-anchor="middle" class="phase-detail">GET /chat HTTP/1.1 → 101 Switching Protocols</text>
</g>
<g id="duplex" transform="translate(50,250)">
<rect x="0" y="0" width="800" height="150" rx="12" class="duplex-bg" tabindex="0" role="button" aria-label="Full Duplex Communication"/>
<text x="400" y="25" text-anchor="middle" class="section-title">② Full-Duplex Communication</text>
<line x1="220" y1="60" x2="600" y2="60" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-ws-green)"/>
<text x="410" y="55" text-anchor="middle" class="msg-label ws-sent">Client → Server: {"type":"message","text":"Hello!"}</text>
<line x1="600" y1="90" x2="220" y2="90" stroke="#5694E4" stroke-width="2.5" marker-end="url(#arrow-ws)"/>
<text x="410" y="85" text-anchor="middle" class="msg-label ws-recv">Server → Client: {"type":"ack","id":42}</text>
<line x1="220" y1="120" x2="600" y2="120" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-ws-green)"/>
<text x="410" y="115" text-anchor="middle" class="msg-label ws-sent">Client → Server: {"type":"typing","user":"Alice"}</text>
</g>
<g id="use-cases" transform="translate(50,430)">
<text x="400" y="20" text-anchor="middle" class="section-title">WebSocket Use Cases</text>
<rect x="20" y="35" width="180" height="65" rx="8" class="usecase-card" data-use="chat" tabindex="0" role="button" aria-label="Chat"/>
<text x="110" y="60" text-anchor="middle" class="usecase-title">Live Chat</text>
<text x="110" y="82" text-anchor="middle" class="usecase-desc">Instant messaging</text>
<rect x="220" y="35" width="180" height="65" rx="8" class="usecase-card" data-use="gaming" tabindex="0" role="button" aria-label="Gaming"/>
<text x="310" y="60" text-anchor="middle" class="usecase-title">Real-Time Gaming</text>
<text x="310" y="82" text-anchor="middle" class="usecase-desc">Multiplayer sync</text>
<rect x="420" y="35" width="180" height="65" rx="8" class="usecase-card" data-use="finance" tabindex="0" role="button" aria-label="Finance"/>
<text x="510" y="60" text-anchor="middle" class="usecase-title">Live Finance</text>
<text x="510" y="82" text-anchor="middle" class="usecase-desc">Stock tickers</text>
<rect x="620" y="35" width="180" height="65" rx="8" class="usecase-card" data-use="iot" tabindex="0" role="button" aria-label="IoT"/>
<text x="710" y="60" text-anchor="middle" class="usecase-title">IoT Monitoring</text>
<text x="710" y="82" text-anchor="middle" class="usecase-desc">Sensor data push</text>
</g>
<g id="frame-types" transform="translate(50,535)">
<rect x="20" y="10" width="120" height="40" rx="8" class="frame-card" data-frame="text" tabindex="0" role="button" aria-label="Text frame"/>
<text x="80" y="35" text-anchor="middle" class="frame-label">Text Frame</text>
<rect x="155" y="10" width="120" height="40" rx="8" class="frame-card" data-frame="binary" tabindex="0" role="button" aria-label="Binary frame"/>
<text x="215" y="35" text-anchor="middle" class="frame-label">Binary Frame</text>
<rect x="290" y="10" width="120" height="40" rx="8" class="frame-card" data-frame="ping" tabindex="0" role="button" aria-label="Ping frame"/>
<text x="350" y="35" text-anchor="middle" class="frame-label">Ping / Pong</text>
<rect x="425" y="10" width="120" height="40" rx="8" class="frame-card" data-frame="close" tabindex="0" role="button" aria-label="Close frame"/>
<text x="485" y="35" text-anchor="middle" class="frame-label">Close Frame</text>
</g>
<g id="ws-packets">
<circle id="ws-dot1" r="4" class="packet-dot" visibility="hidden"/>
<circle id="ws-dot2" r="4" class="packet-dot" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="WebSocket information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">WebSockets Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Excellent!</h2><p>You completed the WebSockets diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

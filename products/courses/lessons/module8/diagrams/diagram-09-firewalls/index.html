<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>Firewalls &amp; NAT — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Firewalls NAT interactive diagram">
<defs>
<marker id="arrow-fw" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l5 10 5-10" fill="#5694E4"/></marker>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">Firewalls &amp; NAT — Network Security</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">Packet Filtering, Zones &amp; Address Translation</text>
<g id="network-zones">
<rect x="50" y="90" width="240" height="200" rx="14" class="zone-lan" tabindex="0" role="button" aria-label="LAN Zone"/>
<text x="170" y="118" text-anchor="middle" class="zone-title">LAN (Internal)</text>
<text x="170" y="140" text-anchor="middle" class="zone-sub">Trusted Network</text>
<rect x="80" y="155" width="80" height="35" rx="6" class="host-lan" data-host="PC1" tabindex="0" role="button" aria-label="PC1"/>
<text x="120" y="177" text-anchor="middle" class="host-label">PC1</text>
<rect x="180" y="155" width="80" height="35" rx="6" class="host-lan" data-host="PC2" tabindex="0" role="button" aria-label="PC2"/>
<text x="220" y="177" text-anchor="middle" class="host-label">PC2</text>
<rect x="80" y="205" width="80" height="35" rx="6" class="host-lan" data-host="Server" tabindex="0" role="button" aria-label="Internal Server"/>
<text x="120" y="227" text-anchor="middle" class="host-label">Server</text>
<rect x="180" y="205" width="80" height="35" rx="6" class="host-lan" data-host="Printer" tabindex="0" role="button" aria-label="Printer"/>
<text x="220" y="227" text-anchor="middle" class="host-label">Printer</text>
</g>
<g id="firewall">
<rect x="340" y="90" width="220" height="200" rx="12" class="firewall-box" tabindex="0" role="button" aria-label="Firewall"/>
<text x="450" y="140" text-anchor="middle" class="fw-title">Firewall</text>
<text x="450" y="162" text-anchor="middle" class="fw-sub">Stateful Inspection</text>
<line x1="380" y1="180" x2="520" y2="180" stroke="var(--border)" stroke-width=".5"/>
<text x="450" y="198" text-anchor="middle" class="fw-rule">Allow: HTTP, HTTPS, DNS</text>
<text x="450" y="218" text-anchor="middle" class="fw-rule-deny">Deny: SSH (ext), Telnet</text>
<text x="450" y="238" text-anchor="middle" class="fw-rule">NAT: 192.168.1.x → 203.0.113.5</text>
<text x="450" y="258" text-anchor="middle" class="fw-rule">State Table: 1,247 active</text>
<path d="M290,190 L340,190" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-fw)"/>
<path d="M560,190 L610,190" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-fw)"/>
</g>
<g id="wan-zone">
<rect x="610" y="90" width="240" height="200" rx="14" class="zone-wan" tabindex="0" role="button" aria-label="WAN Zone"/>
<text x="730" y="118" text-anchor="middle" class="zone-title">WAN (Internet)</text>
<text x="730" y="140" text-anchor="middle" class="zone-sub">Untrusted Network</text>
<circle cx="690" cy="180" r="18" class="host-wan" data-host="Attacker" tabindex="0" role="button" aria-label="Attacker"/>
<text x="690" y="184" text-anchor="middle" class="wan-label">Attacker</text>
<circle cx="770" cy="180" r="18" class="host-wan" data-host="Remote" tabindex="0" role="button" aria-label="Remote Server"/>
<text x="770" y="184" text-anchor="middle" class="wan-label">Remote</text>
<circle cx="690" cy="240" r="18" class="host-wan" data-host="Cloud" tabindex="0" role="button" aria-label="Cloud Service"/>
<text x="690" y="244" text-anchor="middle" class="wan-label">Cloud</text>
<circle cx="770" cy="240" r="18" class="host-wan" data-host="DNS" tabindex="0" role="button" aria-label="DNS Server"/>
<text x="770" y="244" text-anchor="middle" class="wan-label">DNS</text>
</g>
<g id="nat-table" transform="translate(50,315)">
<rect x="0" y="0" width="800" height="120" rx="10" class="nat-bg" tabindex="0" role="button" aria-label="NAT Translation Table"/>
<text x="400" y="22" text-anchor="middle" class="section-title">NAT Translation Table</text>
<line x1="0" y1="32" x2="800" y2="32" stroke="var(--border)" stroke-width="1"/>
<text x="100" y="48" text-anchor="middle" class="nat-header">Internal IP:Port</text>
<text x="300" y="48" text-anchor="middle" class="nat-header">External IP:Port</text>
<text x="500" y="48" text-anchor="middle" class="nat-header">Destination</text>
<text x="700" y="48" text-anchor="middle" class="nat-header">Protocol</text>
<line x1="0" y1="58" x2="800" y2="58" stroke="var(--border)" stroke-width=".5"/>
<text x="100" y="76" text-anchor="middle" class="nat-entry">192.168.1.10:54321</text>
<text x="300" y="76" text-anchor="middle" class="nat-entry">203.0.113.5:12345</text>
<text x="500" y="76" text-anchor="middle" class="nat-entry">93.184.216.34:443</text>
<text x="700" y="76" text-anchor="middle" class="nat-entry">TCP</text>
<text x="100" y="100" text-anchor="middle" class="nat-entry">192.168.1.20:12345</text>
<text x="300" y="100" text-anchor="middle" class="nat-entry">203.0.113.5:23456</text>
<text x="500" y="100" text-anchor="middle" class="nat-entry">8.8.8.8:53</text>
<text x="700" y="100" text-anchor="middle" class="nat-entry">UDP</text>
</g>
<g id="fw-types" transform="translate(50,460)">
<text x="400" y="20" text-anchor="middle" class="section-title">Firewall Types</text>
<rect x="20" y="35" width="180" height="65" rx="8" class="fwtype-card" data-fwtype="packet" tabindex="0" role="button" aria-label="Packet Filter"/>
<text x="110" y="58" text-anchor="middle" class="fwtype-title">Packet Filter</text>
<text x="110" y="80" text-anchor="middle" class="fwtype-desc">Headers only (L3/L4)</text>
<rect x="220" y="35" width="180" height="65" rx="8" class="fwtype-card" data-fwtype="stateful" tabindex="0" role="button" aria-label="Stateful"/>
<text x="310" y="58" text-anchor="middle" class="fwtype-title">Stateful</text>
<text x="310" y="80" text-anchor="middle" class="fwtype-desc">Connection tracking</text>
<rect x="420" y="35" width="180" height="65" rx="8" class="fwtype-card" data-fwtype="proxy" tabindex="0" role="button" aria-label="Proxy"/>
<text x="510" y="58" text-anchor="middle" class="fwtype-title">Proxy Firewall</text>
<text x="510" y="80" text-anchor="middle" class="fwtype-desc">Application layer</text>
<rect x="620" y="35" width="180" height="65" rx="8" class="fwtype-card" data-fwtype="ngfw" tabindex="0" role="button" aria-label="NGFW"/>
<text x="710" y="58" text-anchor="middle" class="fwtype-title">NGFW</text>
<text x="710" y="80" text-anchor="middle" class="fwtype-desc">Deep packet inspection</text>
</g>
<g id="fw-packets">
<circle id="allowed-packet" r="4" class="packet-dot" visibility="hidden"/>
<circle id="blocked-packet" r="4" class="packet-blocked" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="Firewall information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">Firewalls &amp; NAT Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Well done!</h2><p>You completed the Firewalls &amp; NAT diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

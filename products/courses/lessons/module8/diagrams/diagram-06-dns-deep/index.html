<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>DNS Deep Dive — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="DNS Deep Dive interactive diagram">
<defs>
<marker id="arrow-dns" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l5 10 5-10" fill="#5694E4"/></marker>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">DNS Deep Dive — Query Resolution Chain</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">From Browser to Authoritative Nameserver</text>
<g id="dns-chain">
<rect x="30" y="90" width="160" height="65" rx="10" class="dns-node" data-node="browser" tabindex="0" role="button" aria-label="Browser"/>
<text x="110" y="118" text-anchor="middle" class="dns-label">Browser</text>
<text x="110" y="140" text-anchor="middle" class="dns-sub">User types URL</text>
<line x1="190" y1="122" x2="270" y2="122" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-dns)"/>
<rect x="280" y="90" width="160" height="65" rx="10" class="dns-node" data-node="resolver" tabindex="0" role="button" aria-label="Recursive Resolver"/>
<text x="360" y="118" text-anchor="middle" class="dns-label">Recursive Resolver</text>
<text x="360" y="140" text-anchor="middle" class="dns-sub">Cache check</text>
<line x1="440" y1="122" x2="520" y2="122" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-dns)"/>
<rect x="530" y="90" width="160" height="65" rx="10" class="dns-node" data-node="root" tabindex="0" role="button" aria-label="Root Server"/>
<text x="610" y="118" text-anchor="middle" class="dns-label">Root Server</text>
<text x="610" y="140" text-anchor="middle" class="dns-sub">TLD referral</text>
<line x1="690" y1="122" x2="770" y2="122" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-dns)"/>
<rect x="780" y="90" width="100" height="65" rx="10" class="dns-node" data-node="tld" tabindex="0" role="button" aria-label="TLD Server"/>
<text x="830" y="118" text-anchor="middle" class="dns-label">TLD Server</text>
<text x="830" y="140" text-anchor="middle" class="dns-sub">.com</text>
</g>
<g id="dns-vertical" transform="translate(30,200)">
<line x1="830" y1="0" x2="830" y2="40" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-dns)"/>
<rect x="750" y="50" width="160" height="65" rx="10" class="dns-node" data-node="auth" tabindex="0" role="button" aria-label="Authoritative"/>
<text x="830" y="78" text-anchor="middle" class="dns-label">Authoritative</text>
<text x="830" y="100" text-anchor="middle" class="dns-sub">example.com</text>
<line x1="830" y1="115" x2="830" y2="155" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-dns)"/>
<rect x="750" y="165" width="160" height="65" rx="10" class="dns-node" data-node="record" tabindex="0" role="button" aria-label="DNS Records"/>
<text x="830" y="193" text-anchor="middle" class="dns-label">DNS Records</text>
<text x="830" y="215" text-anchor="middle" class="dns-sub">A, AAAA, CNAME</text>
</g>
<g id="dns-response" transform="translate(30,280)">
<line x1="830" y1="0" x2="830" y2="30" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-dns)" stroke-dasharray="5,3"/>
<rect x="280" y="40" width="480" height="70" rx="10" class="response-box" tabindex="0" role="button" aria-label="DNS Response"/>
<text x="520" y="65" text-anchor="middle" class="response-title">DNS Response Chain</text>
<text x="520" y="85" text-anchor="middle" class="response-detail">192.168.1.10 → 10.0.0.1 → 198.41.0.4 → a.gtld-servers.net → ns1.example.com</text>
<text x="520" y="102" text-anchor="middle" class="response-detail">Final Answer: 93.184.216.34 (A record for example.com)</text>
</g>
<g id="record-types" transform="translate(50,400)">
<text x="400" y="20" text-anchor="middle" class="section-title">DNS Record Types</text>
<rect x="20" y="35" width="170" height="55" rx="8" class="record-card" data-record="A" tabindex="0" role="button" aria-label="A record"/>
<text x="105" y="57" text-anchor="middle" class="record-title">A Record</text>
<text x="105" y="78" text-anchor="middle" class="record-sub">IPv4 Address mapping</text>
<rect x="205" y="35" width="170" height="55" rx="8" class="record-card" data-record="AAAA" tabindex="0" role="button" aria-label="AAAA record"/>
<text x="290" y="57" text-anchor="middle" class="record-title">AAAA Record</text>
<text x="290" y="78" text-anchor="middle" class="record-sub">IPv6 Address mapping</text>
<rect x="390" y="35" width="170" height="55" rx="8" class="record-card" data-record="CNAME" tabindex="0" role="button" aria-label="CNAME record"/>
<text x="475" y="57" text-anchor="middle" class="record-title">CNAME Record</text>
<text x="475" y="78" text-anchor="middle" class="record-sub">Canonical name alias</text>
<rect x="575" y="35" width="170" height="55" rx="8" class="record-card" data-record="MX" tabindex="0" role="button" aria-label="MX record"/>
<text x="660" y="57" text-anchor="middle" class="record-title">MX Record</text>
<text x="660" y="78" text-anchor="middle" class="record-sub">Mail exchange server</text>
<rect x="760" y="35" width="110" height="55" rx="8" class="record-card" data-record="NS" tabindex="0" role="button" aria-label="NS record"/>
<text x="815" y="57" text-anchor="middle" class="record-title">NS Record</text>
<text x="815" y="78" text-anchor="middle" class="record-sub">Nameserver delegation</text>
</g>
<g id="dns-packets">
<circle id="query-dot" r="5" class="packet-dot" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="DNS information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">DNS Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Done!</h2><p>You completed the DNS Deep Dive diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

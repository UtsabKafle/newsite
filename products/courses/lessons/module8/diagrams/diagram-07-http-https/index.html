<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>HTTP &amp; HTTPS — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="HTTP HTTPS interactive diagram">
<defs>
<marker id="arrow-http" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l5 10 5-10" fill="#5694E4"/></marker>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">HTTP &amp; HTTPS — TLS 1.3 Handshake</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">Secure Web Communication Flow</text>
<g id="client-server">
<rect x="50" y="100" width="200" height="120" rx="14" class="client-node" tabindex="0" role="button" aria-label="Client"/>
<text x="150" y="140" text-anchor="middle" class="cs-label">Client</text>
<text x="150" y="162" text-anchor="middle" class="cs-sub">Browser</text>
<text x="150" y="184" text-anchor="middle" class="cs-detail">User-Agent: Chrome</text>
<text x="150" y="204" text-anchor="middle" class="cs-detail">Cipher Suites: TLS_AES_128_GCM</text>
<rect x="650" y="100" width="200" height="120" rx="14" class="server-node" tabindex="0" role="button" aria-label="Server"/>
<text x="750" y="140" text-anchor="middle" class="cs-label">Server</text>
<text x="750" y="162" text-anchor="middle" class="cs-sub">Web Server</text>
<text x="750" y="184" text-anchor="middle" class="cs-detail">TLS Certificate</text>
<text x="750" y="204" text-anchor="middle" class="cs-detail">RSA 2048-bit</text>
</g>
<g id="handshake-steps">
<line x1="250" y1="130" x2="650" y2="130" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-http)"/>
<text x="450" y="122" text-anchor="middle" class="step-label">1. ClientHello (TLS version, cipher suites)</text>
<line x1="650" y1="160" x2="250" y2="160" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-http)"/>
<text x="450" y="152" text-anchor="middle" class="step-label">2. ServerHello (certificate, key exchange)</text>
<line x1="250" y1="190" x2="650" y2="190" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-http)"/>
<text x="450" y="182" text-anchor="middle" class="step-label">3. ClientKeyExchange (Pre-master secret)</text>
<line x1="650" y1="220" x2="250" y2="220" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-http)"/>
<text x="450" y="212" text-anchor="middle" class="step-label">4. Finished (Encrypted handshake)</text>
</g>
<g id="http-vs-https" transform="translate(50,260)">
<text x="400" y="25" text-anchor="middle" class="section-title">HTTP vs HTTPS Comparison</text>
<rect x="30" y="40" width="360" height="130" rx="10" class="http-box" data-mode="http" tabindex="0" role="button" aria-label="HTTP"/>
<text x="210" y="65" text-anchor="middle" class="mode-title">HTTP</text>
<text x="210" y="88" text-anchor="middle" class="mode-sub">Port 80 · Unencrypted</text>
<line x1="60" y1="100" x2="360" y2="100" stroke="var(--border)" stroke-width=".5"/>
<text x="80" y="118" text-anchor="start" class="mode-comp">GET /index.html HTTP/1.1</text>
<text x="80" y="140" text-anchor="start" class="mode-comp">Host: example.com</text>
<text x="80" y="160" text-anchor="start" class="mode-comp-insecure">⚠ Plain text · No encryption</text>
<rect x="440" y="40" width="360" height="130" rx="10" class="https-box" data-mode="https" tabindex="0" role="button" aria-label="HTTPS"/>
<text x="620" y="65" text-anchor="middle" class="mode-title">HTTPS</text>
<text x="620" y="88" text-anchor="middle" class="mode-sub">Port 443 · TLS Encrypted</text>
<line x1="470" y1="100" x2="770" y2="100" stroke="var(--border)" stroke-width=".5"/>
<text x="470" y="118" text-anchor="start" class="mode-comp">POST /api/login HTTP/2</text>
<text x="470" y="140" text-anchor="start" class="mode-comp">Host: secure.example.com</text>
<text x="470" y="160" text-anchor="start" class="mode-comp-secure">🔒 Encrypted · TLS 1.3</text>
</g>
<g id="status-codes" transform="translate(50,440)">
<text x="400" y="20" text-anchor="middle" class="section-title">HTTP Status Codes</text>
<rect x="20" y="35" width="120" height="55" rx="8" class="status-card" data-status="2xx" tabindex="0" role="button" aria-label="2xx Success"/>
<text x="80" y="57" text-anchor="middle" class="status-code">2xx</text>
<text x="80" y="78" text-anchor="middle" class="status-desc">Success</text>
<rect x="155" y="35" width="120" height="55" rx="8" class="status-card" data-status="3xx" tabindex="0" role="button" aria-label="3xx Redirect"/>
<text x="215" y="57" text-anchor="middle" class="status-code">3xx</text>
<text x="215" y="78" text-anchor="middle" class="status-desc">Redirect</text>
<rect x="290" y="35" width="120" height="55" rx="8" class="status-card" data-status="4xx" tabindex="0" role="button" aria-label="4xx Client Error"/>
<text x="350" y="57" text-anchor="middle" class="status-code">4xx</text>
<text x="350" y="78" text-anchor="middle" class="status-desc">Client Error</text>
<rect x="425" y="35" width="120" height="55" rx="8" class="status-card" data-status="5xx" tabindex="0" role="button" aria-label="5xx Server Error"/>
<text x="485" y="57" text-anchor="middle" class="status-code">5xx</text>
<text x="485" y="78" text-anchor="middle" class="status-desc">Server Error</text>
</g>
<g id="methods" transform="translate(50,520)">
<rect x="20" y="10" width="100" height="40" rx="8" class="method-card" data-method="GET" tabindex="0" role="button" aria-label="GET method"/>
<text x="70" y="35" text-anchor="middle" class="method-label">GET</text>
<rect x="130" y="10" width="100" height="40" rx="8" class="method-card" data-method="POST" tabindex="0" role="button" aria-label="POST method"/>
<text x="180" y="35" text-anchor="middle" class="method-label">POST</text>
<rect x="240" y="10" width="100" height="40" rx="8" class="method-card" data-method="PUT" tabindex="0" role="button" aria-label="PUT method"/>
<text x="290" y="35" text-anchor="middle" class="method-label">PUT</text>
<rect x="350" y="10" width="100" height="40" rx="8" class="method-card" data-method="DELETE" tabindex="0" role="button" aria-label="DELETE method"/>
<text x="400" y="35" text-anchor="middle" class="method-label">DELETE</text>
<rect x="460" y="10" width="100" height="40" rx="8" class="method-card" data-method="PATCH" tabindex="0" role="button" aria-label="PATCH method"/>
<text x="510" y="35" text-anchor="middle" class="method-label">PATCH</text>
</g>
<g id="http-packets">
<rect id="http-frame" x="-20" y="0" width="16" height="10" rx="2" class="frame-dot" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="HTTP information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">HTTP &amp; HTTPS Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Perfect!</h2><p>You completed the HTTP &amp; HTTPS diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

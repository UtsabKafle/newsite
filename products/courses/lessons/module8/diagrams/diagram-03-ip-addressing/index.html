<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>IP Addressing &amp; Subnets — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="IP Addressing interactive diagram">
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ipGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0959C8"/><stop offset="100%" stop-color="#0747A3"/></linearGradient>
<linearGradient id="ipGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2475D9"/><stop offset="100%" stop-color="#0959C8"/></linearGradient>
<linearGradient id="ipGrad3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5694E4"/><stop offset="100%" stop-color="#2475D9"/></linearGradient>
<linearGradient id="ipGrad4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#72A5E8"/><stop offset="100%" stop-color="#5694E4"/></linearGradient>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">IP Addressing &amp; Subnetting</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">IPv4 Address Structure, CIDR &amp; Subnet Ranges</text>
<g id="ip-parts" transform="translate(50,80)">
<rect x="0" y="0" width="800" height="80" rx="10" class="addr-bg"/>
<text x="400" y="25" text-anchor="middle" class="addr-title">IPv4 Address: 192.168.1.0/24</text>
<rect x="30" y="40" width="155" height="30" rx="6" class="octet-box" data-octet="192" tabindex="0" role="button" aria-label="First octet: Network"/>
<text x="107" y="60" text-anchor="middle" class="octet-text">192</text>
<rect x="195" y="40" width="155" height="30" rx="6" class="octet-box" data-octet="168" tabindex="0" role="button" aria-label="Second octet: Network"/>
<text x="272" y="60" text-anchor="middle" class="octet-text">168</text>
<rect x="360" y="40" width="155" height="30" rx="6" class="octet-box" data-octet="1" tabindex="0" role="button" aria-label="Third octet: Subnet"/>
<text x="437" y="60" text-anchor="middle" class="octet-text">1</text>
<rect x="525" y="40" width="155" height="30" rx="6" class="octet-box" data-octet="0" tabindex="0" role="button" aria-label="Fourth octet: Host"/>
<text x="602" y="60" text-anchor="middle" class="octet-text">0</text>
<text x="700" y="60" text-anchor="start" class="cidr-text">/24</text>
</g>
<g id="subnet-bits" transform="translate(50,180)">
<text x="400" y="20" text-anchor="middle" class="section-title">32-bit Address Breakdown</text>
<g transform="translate(70,40)">
<rect x="0" y="0" width="120" height="40" rx="4" class="bit-box net-bit" data-bit="net" tabindex="0" role="button" aria-label="Network bits"/>
<rect x="130" y="0" width="120" height="40" rx="4" class="bit-box net-bit" data-bit="net"/>
<rect x="260" y="0" width="120" height="40" rx="4" class="bit-box net-bit" data-bit="net"/>
<rect x="390" y="0" width="120" height="40" rx="4" class="bit-box sub-bit" data-bit="sub" tabindex="0" role="button" aria-label="Subnet bits"/>
<rect x="520" y="0" width="40" height="40" rx="4" class="bit-box host-bit" data-bit="host" tabindex="0" role="button" aria-label="Host bits"/>
<rect x="570" y="0" width="40" height="40" rx="4" class="bit-box host-bit" data-bit="host"/>
<rect x="620" y="0" width="40" height="40" rx="4" class="bit-box host-bit" data-bit="host"/>
<rect x="670" y="0" width="40" height="40" rx="4" class="bit-box host-bit" data-bit="host"/>
<text x="60" y="60" text-anchor="middle" class="bit-label">Network (24 bits)</text>
<text x="450" y="60" text-anchor="middle" class="bit-label sub-label">Subnet (8 bits)</text>
<text x="645" y="60" text-anchor="middle" class="bit-label host-label">Host (8 bits)</text>
</g>
</g>
<g id="network-nodes" transform="translate(50,300)">
<text x="400" y="25" text-anchor="middle" class="section-title">Subnet Topology</text>
<rect x="300" y="40" width="200" height="40" rx="8" class="router-box" tabindex="0" role="button" aria-label="Router"/>
<text x="400" y="65" text-anchor="middle" class="node-label">Router 192.168.1.1</text>
<line x1="400" y1="80" x2="200" y2="140" stroke="#5694E4" stroke-width="1.5" opacity=".5"/>
<line x1="400" y1="80" x2="400" y2="140" stroke="#5694E4" stroke-width="1.5" opacity=".5"/>
<line x1="400" y1="80" x2="600" y2="140" stroke="#5694E4" stroke-width="1.5" opacity=".5"/>
<rect x="120" y="140" width="160" height="40" rx="8" class="host-box" data-ip="192.168.1.10" tabindex="0" role="button" aria-label="Host 192.168.1.10"/>
<text x="200" y="165" text-anchor="middle" class="node-label">Host .10</text>
<rect x="320" y="140" width="160" height="40" rx="8" class="host-box" data-ip="192.168.1.20" tabindex="0" role="button" aria-label="Host 192.168.1.20"/>
<text x="400" y="165" text-anchor="middle" class="node-label">Host .20</text>
<rect x="520" y="140" width="160" height="40" rx="8" class="host-box" data-ip="192.168.1.30" tabindex="0" role="button" aria-label="Host 192.168.1.30"/>
<text x="600" y="165" text-anchor="middle" class="node-label">Host .30</text>
</g>
<g id="subnet-info" transform="translate(50,500)">
<text x="400" y="20" text-anchor="middle" class="section-title">Subnet Details</text>
<rect x="50" y="35" width="220" height="50" rx="8" class="info-card" tabindex="0" role="button" aria-label="Network Address"/>
<text x="160" y="55" text-anchor="middle" class="card-label">Network Address</text>
<text x="160" y="72" text-anchor="middle" class="card-value">192.168.1.0</text>
<rect x="290" y="35" width="220" height="50" rx="8" class="info-card" tabindex="0" role="button" aria-label="Broadcast Address"/>
<text x="400" y="55" text-anchor="middle" class="card-label">Broadcast Address</text>
<text x="400" y="72" text-anchor="middle" class="card-value">192.168.1.255</text>
<rect x="530" y="35" width="220" height="50" rx="8" class="info-card" tabindex="0" role="button" aria-label="Usable Hosts"/>
<text x="640" y="55" text-anchor="middle" class="card-label">Usable Hosts</text>
<text x="640" y="72" text-anchor="middle" class="card-value">254</text>
</g>
<g id="data-packets">
<circle id="packet1" r="5" class="packet-dot" visibility="hidden"/>
<circle id="packet2" r="5" class="packet-dot" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="IP information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">IP Addressing Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Well done!</h2><p>You completed the IP Addressing diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

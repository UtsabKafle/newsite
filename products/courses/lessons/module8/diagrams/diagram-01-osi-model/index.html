<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>OSI Model — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true">
  <div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div>
  <div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
</div>
<div id="error-boundary" class="error-boundary" role="alert" hidden>
  <div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div>
</div>
<div id="app" hidden>
  <div id="action-bar" class="action-bar">
    <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    <div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1" aria-label="Animation speed"><span id="speed-value" class="speed-value">1×</span></div>
    <button id="reset-btn" class="btn-icon" aria-label="Reset diagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
  </div>
  <div id="diagram-container" class="diagram-container">
    <svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="OSI Model interactive diagram">
      <defs>
        <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l5 10 5-10" fill="#5694E4"/></marker>
        <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 10l5-10 5 10" fill="#5694E4"/></marker>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="layerGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0959C8"/><stop offset="100%" stop-color="#0747A3"/></linearGradient>
        <linearGradient id="layerGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F6BDF"/><stop offset="100%" stop-color="#0959C8"/></linearGradient>
        <linearGradient id="layerGrad3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2475D9"/><stop offset="100%" stop-color="#0F6BDF"/></linearGradient>
        <linearGradient id="layerGrad4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5694E4"/><stop offset="100%" stop-color="#2475D9"/></linearGradient>
        <linearGradient id="layerGrad5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#72A5E8"/><stop offset="100%" stop-color="#5694E4"/></linearGradient>
        <linearGradient id="layerGrad6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8EB8EF"/><stop offset="100%" stop-color="#72A5E8"/></linearGradient>
        <linearGradient id="layerGrad7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A8C8F3"/><stop offset="100%" stop-color="#8EB8EF"/></linearGradient>
      </defs>
      <rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
      <text x="450" y="45" text-anchor="middle" class="viz-title">OSI Model — 7 Layers</text>
      <text x="450" y="65" text-anchor="middle" class="viz-subtitle">Data Encapsulation &amp; Communication</text>
      <g id="layers-group">
        <rect x="60" y="85" width="780" height="65" rx="10" class="layer-box" data-layer="7" tabindex="0" role="button" aria-label="Layer 7: Application">
          <title>Layer 7: Application</title>
        </rect>
        <rect x="60" y="155" width="780" height="65" rx="10" class="layer-box" data-layer="6" tabindex="0" role="button" aria-label="Layer 6: Presentation">
          <title>Layer 6: Presentation</title>
        </rect>
        <rect x="60" y="225" width="780" height="65" rx="10" class="layer-box" data-layer="5" tabindex="0" role="button" aria-label="Layer 5: Session">
          <title>Layer 5: Session</title>
        </rect>
        <rect x="60" y="295" width="780" height="65" rx="10" class="layer-box" data-layer="4" tabindex="0" role="button" aria-label="Layer 4: Transport">
          <title>Layer 4: Transport</title>
        </rect>
        <rect x="60" y="365" width="780" height="65" rx="10" class="layer-box" data-layer="3" tabindex="0" role="button" aria-label="Layer 3: Network">
          <title>Layer 3: Network</title>
        </rect>
        <rect x="60" y="435" width="780" height="65" rx="10" class="layer-box" data-layer="2" tabindex="0" role="button" aria-label="Layer 2: Data Link">
          <title>Layer 2: Data Link</title>
        </rect>
        <rect x="60" y="505" width="780" height="65" rx="10" class="layer-box" data-layer="1" tabindex="0" role="button" aria-label="Layer 1: Physical">
          <title>Layer 1: Physical</title>
        </rect>
        <text x="450" y="605" text-anchor="middle" class="viz-arrow-label">Data Flow Direction</text>
        <line x1="220" y1="620" x2="680" y2="620" stroke="#5694E4" stroke-width="2" marker-end="url(#arrow-down)" marker-start="url(#arrow-up)"/>
        <text x="450" y="645" text-anchor="middle" class="viz-caption">Sending ↓ Encapsulation &nbsp;&nbsp;&nbsp; Receiving ↑ Decapsulation</text>
      </g>
      <g id="packet-flow" aria-hidden="true">
        <circle id="packet-dot" r="6" class="packet-dot" filter="url(#glow)">
          <animate id="packet-anim-down" attributeName="cy" from="95" to="540" dur="3s" repeatCount="indefinite" fill="freeze"/>
        </circle>
      </g>
      <g id="layer-labels">
        <text x="450" y="115" text-anchor="middle" class="layer-label" data-layer="7">Application</text>
        <text x="450" y="185" text-anchor="middle" class="layer-label" data-layer="6">Presentation</text>
        <text x="450" y="255" text-anchor="middle" class="layer-label" data-layer="5">Session</text>
        <text x="450" y="325" text-anchor="middle" class="layer-label" data-layer="4">Transport</text>
        <text x="450" y="395" text-anchor="middle" class="layer-label" data-layer="3">Network</text>
        <text x="450" y="465" text-anchor="middle" class="layer-label" data-layer="2">Data Link</text>
        <text x="450" y="535" text-anchor="middle" class="layer-label" data-layer="1">Physical</text>
      </g>
      <g id="encapsulation-labels" class="encap-labels">
        <text x="780" y="115" text-anchor="end" class="encap-text" data-layer="7">Data (HTTP/FTP/SMTP)</text>
        <text x="780" y="185" text-anchor="end" class="encap-text" data-layer="6">Encrypted Data</text>
        <text x="780" y="255" text-anchor="end" class="encap-text" data-layer="5">Session Data</text>
        <text x="780" y="325" text-anchor="end" class="encap-text" data-layer="4">Segment (TCP/UDP)</text>
        <text x="780" y="395" text-anchor="end" class="encap-text" data-layer="3">Packet (IP)</text>
        <text x="780" y="465" text-anchor="end" class="encap-text" data-layer="2">Frame (MAC)</text>
        <text x="780" y="535" text-anchor="end" class="encap-text" data-layer="1">Bits</text>
      </g>
    </svg>
  </div>
  <div id="info-panel" class="info-panel" role="dialog" aria-label="Layer information" hidden>
    <button id="info-close" class="btn-icon info-close" aria-label="Close info panel">&times;</button>
    <h3 id="info-title" class="info-title"></h3>
    <p id="info-desc" class="info-desc"></p>
    <div id="info-details" class="info-details"></div>
  </div>
  <div id="controls" class="controls-bar">
    <button id="play-btn" class="btn-primary" aria-label="Toggle packet animation">Play</button>
    <button id="challenge-btn" class="btn-secondary" aria-label="Start challenge">Challenge</button>
  </div>
  <div id="challenge-section" class="challenge-section" hidden>
    <h3 class="challenge-title">OSI Model Challenge</h3>
    <div id="challenge-questions" class="challenge-questions"></div>
    <div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
    <div id="challenge-result" class="challenge-result" hidden></div>
  </div>
  <div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Module complete" hidden>
    <div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Congratulations!</h2><p>You've completed the OSI Model diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

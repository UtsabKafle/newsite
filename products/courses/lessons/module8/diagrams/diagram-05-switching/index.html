<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0959C8">
<title>Switching — Interactive Diagram | Consica Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="skeleton" class="skeleton" aria-hidden="true"><div class="skeleton-header"><div class="skeleton-line w-48"></div><div class="skeleton-line w-72"></div></div><div class="skeleton-body"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div></div>
<div id="error-boundary" class="error-boundary" role="alert" hidden><div class="error-content"><svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h2>Something went wrong</h2><p id="error-msg">An error occurred loading the diagram.</p><button id="error-retry" class="btn">Retry</button></div></div>
<div id="app" hidden>
<div id="action-bar" class="action-bar">
<button id="theme-toggle" class="btn-icon" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
<div class="speed-control"><label for="speed-slider" class="speed-label">Speed</label><input type="range" id="speed-slider" class="speed-slider" min="0.25" max="4" step="0.25" value="1"><span id="speed-value" class="speed-value">1×</span></div>
<button id="reset-btn" class="btn-icon" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
</div>
<div id="diagram-container" class="diagram-container">
<svg id="diagram-svg" class="diagram-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Switching interactive diagram">
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="switchGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0959C8"/><stop offset="100%" stop-color="#0747A3"/></linearGradient>
</defs>
<rect x="10" y="10" width="880" height="680" rx="16" class="viz-bg"/>
<text x="450" y="40" text-anchor="middle" class="viz-title">Switching — MAC Table &amp; Frame Forwarding</text>
<text x="450" y="60" text-anchor="middle" class="viz-subtitle">Layer 2 Ethernet Switch Operations</text>
<g id="switch-diagram" transform="translate(300,80)">
<rect x="0" y="40" width="300" height="160" rx="16" class="switch-body" tabindex="0" role="button" aria-label="Ethernet Switch"/>
<text x="150" y="68" text-anchor="middle" class="switch-title">Ethernet Switch</text>
<text x="150" y="88" text-anchor="middle" class="switch-sub">Layer 2 Forwarding</text>
<circle cx="50" cy="130" r="14" class="port-circle" data-port="1" tabindex="0" role="button" aria-label="Port 1"/>
<text x="50" y="134" text-anchor="middle" class="port-label">P1</text>
<circle cx="100" cy="130" r="14" class="port-circle" data-port="2" tabindex="0" role="button" aria-label="Port 2"/>
<text x="100" y="134" text-anchor="middle" class="port-label">P2</text>
<circle cx="150" cy="130" r="14" class="port-circle" data-port="3" tabindex="0" role="button" aria-label="Port 3"/>
<text x="150" y="134" text-anchor="middle" class="port-label">P3</text>
<circle cx="200" cy="130" r="14" class="port-circle" data-port="4" tabindex="0" role="button" aria-label="Port 4"/>
<text x="200" y="134" text-anchor="middle" class="port-label">P4</text>
<circle cx="250" cy="130" r="14" class="port-circle" data-port="5" tabindex="0" role="button" aria-label="Port 5"/>
<text x="250" y="134" text-anchor="middle" class="port-label">P5</text>
</g>
<g id="connected-devices">
<rect x="60" y="280" width="130" height="50" rx="10" class="device-box" data-device="A" tabindex="0" role="button" aria-label="Device A"/>
<text x="125" y="308" text-anchor="middle" class="device-label">Device A</text>
<text x="125" y="322" text-anchor="middle" class="device-mac">AA:AA:AA:AA:AA:01</text>
<rect x="350" y="280" width="130" height="50" rx="10" class="device-box" data-device="B" tabindex="0" role="button" aria-label="Device B"/>
<text x="415" y="308" text-anchor="middle" class="device-label">Device B</text>
<text x="415" y="322" text-anchor="middle" class="device-mac">BB:BB:BB:BB:BB:02</text>
<rect x="640" y="280" width="130" height="50" rx="10" class="device-box" data-device="C" tabindex="0" role="button" aria-label="Device C"/>
<text x="705" y="308" text-anchor="middle" class="device-label">Device C</text>
<text x="705" y="322" text-anchor="middle" class="device-mac">CC:CC:CC:CC:CC:03</text>
<line x1="125" y1="280" x2="370" y2="200" stroke="#5694E4" stroke-width="1.5" class="conn-line" data-conn="A-SW"/>
<line x1="415" y1="280" x2="420" y2="200" stroke="#5694E4" stroke-width="1.5" class="conn-line" data-conn="B-SW"/>
<line x1="705" y1="280" x2="470" y2="200" stroke="#5694E4" stroke-width="1.5" class="conn-line" data-conn="C-SW"/>
</g>
<g id="mac-table" transform="translate(50,370)">
<rect x="0" y="0" width="800" height="140" rx="10" class="mac-bg" tabindex="0" role="button" aria-label="MAC Address Table"/>
<text x="400" y="25" text-anchor="middle" class="mac-title">MAC Address Table</text>
<line x1="0" y1="35" x2="800" y2="35" stroke="var(--border)" stroke-width="1"/>
<text x="150" y="52" text-anchor="middle" class="mac-header">MAC Address</text>
<text x="350" y="52" text-anchor="middle" class="mac-header">Port</text>
<text x="550" y="52" text-anchor="middle" class="mac-header">Age</text>
<text x="700" y="52" text-anchor="middle" class="mac-header">VLAN</text>
<line x1="0" y1="62" x2="800" y2="62" stroke="var(--border)" stroke-width=".5"/>
<text x="150" y="82" text-anchor="middle" class="mac-entry" data-mac="AA:AA:AA:AA:AA:01">AA:AA:AA:AA:AA:01</text>
<text x="350" y="82" text-anchor="middle" class="mac-entry">Port 1</text>
<text x="550" y="82" text-anchor="middle" class="mac-entry">12s</text>
<text x="700" y="82" text-anchor="middle" class="mac-entry">1</text>
<text x="150" y="107" text-anchor="middle" class="mac-entry" data-mac="BB:BB:BB:BB:BB:02">BB:BB:BB:BB:BB:02</text>
<text x="350" y="107" text-anchor="middle" class="mac-entry">Port 2</text>
<text x="550" y="107" text-anchor="middle" class="mac-entry">8s</text>
<text x="700" y="107" text-anchor="middle" class="mac-entry">1</text>
<text x="150" y="132" text-anchor="middle" class="mac-entry" data-mac="CC:CC:CC:CC:CC:03">CC:CC:CC:CC:CC:03</text>
<text x="350" y="132" text-anchor="middle" class="mac-entry">Port 3</text>
<text x="550" y="132" text-anchor="middle" class="mac-entry">5s</text>
<text x="700" y="132" text-anchor="middle" class="mac-entry">1</text>
</g>
<g id="forwarding-modes" transform="translate(50,540)">
<text x="400" y="20" text-anchor="middle" class="section-title">Forwarding Methods</text>
<rect x="30" y="35" width="230" height="60" rx="8" class="fwd-card" data-fwd="store" tabindex="0" role="button" aria-label="Store and forward"/>
<text x="145" y="60" text-anchor="middle" class="fwd-title">Store-and-Forward</text>
<text x="145" y="80" text-anchor="middle" class="fwd-sub">Full CRC check</text>
<rect x="290" y="35" width="230" height="60" rx="8" class="fwd-card" data-fwd="cut" tabindex="0" role="button" aria-label="Cut-through"/>
<text x="405" y="60" text-anchor="middle" class="fwd-title">Cut-Through</text>
<text x="405" y="80" text-anchor="middle" class="fwd-sub">Lowest latency</text>
<rect x="550" y="35" width="230" height="60" rx="8" class="fwd-card" data-fwd="frag" tabindex="0" role="button" aria-label="Fragment free"/>
<text x="665" y="60" text-anchor="middle" class="fwd-title">Fragment-Free</text>
<text x="665" y="80" text-anchor="middle" class="fwd-sub">Checks first 64 bytes</text>
</g>
<g id="frames">
<rect id="frame1" x="-30" y="0" width="20" height="12" rx="2" class="frame-dot" visibility="hidden"/>
</g>
</svg>
</div>
<div id="info-panel" class="info-panel" role="dialog" aria-label="Switch information" hidden>
<button id="info-close" class="btn-icon info-close">&times;</button>
<h3 id="info-title" class="info-title"></h3>
<p id="info-desc" class="info-desc"></p>
<div id="info-details" class="info-details"></div>
</div>
<div id="controls" class="controls-bar">
<button id="play-btn" class="btn-primary">Play</button>
<button id="challenge-btn" class="btn-secondary">Challenge</button>
</div>
<div id="challenge-section" class="challenge-section" hidden>
<h3 class="challenge-title">Switching Challenge</h3>
<div id="challenge-questions" class="challenge-questions"></div>
<div class="challenge-actions"><button id="challenge-submit" class="btn-primary">Submit</button><button id="challenge-retry" class="btn-secondary">Retry</button></div>
<div id="challenge-result" class="challenge-result" hidden></div>
</div>
<div id="completion-overlay" class="completion-overlay" role="dialog" aria-modal="true" aria-label="Complete" hidden>
<div class="completion-card"><svg class="completion-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><h2>Great work!</h2><p>You completed the Switching diagram.</p><button id="completion-close" class="btn-primary">Continue</button></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>

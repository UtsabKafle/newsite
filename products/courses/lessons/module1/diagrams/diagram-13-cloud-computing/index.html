<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Computing Services</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>Cloud Computing Services</h1>
      <p>How devices connect to cloud services</p>
    </header>

    <main id="main">
      <div id="diagram-wrapper">
        <svg id="diagram" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cloud computing diagram showing devices connecting to cloud services">

          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Background grid dots -->
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="20" r="1" fill="#1a2235" opacity="0.5"/>
          </pattern>
          <rect width="100%" height="100%" fill="url(#grid)"/>

          <!-- ==================== CONNECTION PATHS ==================== -->

          <!-- Device to Cloud paths -->
          <path id="path-laptop-cloud" class="conn-path" d="M 215,105 C 325,105 365,230 440,230" />
          <path id="path-phone-cloud"   class="conn-path" d="M 190,290 C 325,290 365,300 440,300" />
          <path id="path-tablet-cloud"  class="conn-path" d="M 215,435 C 325,435 365,370 440,370" />

          <!-- Cloud to Service paths -->
          <path id="path-cloud-storage"    class="conn-path" d="M 560,230 C 670,230 720,105 840,105" />
          <path id="path-cloud-email"      class="conn-path" d="M 560,270 C 670,270 720,255 840,255" />
          <path id="path-cloud-streaming"  class="conn-path" d="M 560,320 C 670,320 720,398 845,398" />
          <path id="path-cloud-aiml"       class="conn-path" d="M 560,340 C 670,340 730,540 840,540" />

          <!-- ==================== DEVICES (LEFT) ==================== -->

          <!-- Laptop -->
          <g id="device-laptop" class="device-group" data-device="laptop">
            <rect class="device-body" x="80" y="65" width="135" height="80" rx="6" />
            <rect class="device-screen" x="92" y="77" width="111" height="56" rx="3" />
            <rect class="device-base" x="72" y="145" width="151" height="10" rx="3" />
            <rect class="device-hinge" x="110" y="145" width="75" height="4" rx="1" />
            <text class="device-label" x="147" y="175">Laptop</text>
          </g>

          <!-- Phone -->
          <g id="device-phone" class="device-group" data-device="phone">
            <rect class="device-body" x="115" y="230" width="75" height="130" rx="14" />
            <rect class="device-screen" x="126" y="244" width="53" height="98" rx="5" />
            <circle class="device-button" cx="152" cy="350" r="5" />
            <circle class="device-silent" cx="152" cy="237" r="3" />
            <text class="device-label" x="152" y="378">Phone</text>
          </g>

          <!-- Tablet -->
          <g id="device-tablet" class="device-group" data-device="tablet">
            <rect class="device-body" x="80" y="395" width="135" height="90" rx="10" />
            <rect class="device-screen" x="92" y="407" width="111" height="66" rx="4" />
            <circle class="device-button" cx="147" cy="477" r="4" />
            <text class="device-label" x="147" y="503">Tablet</text>
          </g>

          <!-- ==================== CLOUD (CENTER) ==================== -->

          <g id="cloud-group">
            <ellipse class="cloud-circle" cx="470" cy="295" rx="30" ry="25" />
            <ellipse class="cloud-circle" cx="530" cy="290" rx="35" ry="30" />
            <ellipse class="cloud-circle" cx="500" cy="280" rx="40" ry="35" />
            <rect class="cloud-rect" x="455" y="295" width="90" height="45" rx="8" />
            <text class="cloud-label" x="500" y="370">The Cloud</text>
          </g>

          <!-- ==================== SERVICES (RIGHT) ==================== -->

          <!-- Storage -->
          <g id="service-storage" class="service-group" data-service="storage">
            <ellipse class="service-shape" cx="880" cy="88" rx="38" ry="12" />
            <rect class="service-shape" x="842" y="88" width="76" height="48" />
            <ellipse class="service-shape" cx="880" cy="136" rx="38" ry="12" />
            <rect class="service-inner" x="852" y="100" width="56" height="24" rx="3" />
            <text class="service-label" x="880" y="168">Storage</text>
          </g>

          <!-- Email -->
          <g id="service-email" class="service-group" data-service="email">
            <rect class="service-shape" x="840" y="237" width="80" height="50" rx="6" />
            <polyline class="service-flap" points="840,242 880,268 920,242" />
            <text class="service-label" x="880" y="305">Email</text>
          </g>

          <!-- Streaming -->
          <g id="service-streaming" class="service-group" data-service="streaming">
            <rect class="service-shape" x="845" y="380" width="70" height="48" rx="10" />
            <polygon class="service-play" points="862,390 862,418 885,404" />
            <text class="service-label" x="880" y="448">Streaming</text>
          </g>

          <!-- AI/ML -->
          <g id="service-aiml" class="service-group" data-service="aiml">
            <circle class="service-node" cx="863" cy="530" r="14" />
            <circle class="service-node" cx="897" cy="517" r="9" />
            <circle class="service-node" cx="858" cy="555" r="9" />
            <circle class="service-node" cx="895" cy="550" r="7" />
            <line class="service-line" x1="863" y1="530" x2="897" y2="517" />
            <line class="service-line" x1="863" y1="530" x2="858" y2="555" />
            <line class="service-line" x1="897" y1="517" x2="895" y2="550" />
            <line class="service-line" x1="858" y1="555" x2="895" y2="550" />
            <text class="service-label" x="880" y="582">AI / ML</text>
          </g>

          <!-- ==================== ANIMATED DOTS ==================== -->
          <g id="dots-laptop-cloud" class="dot-group" data-path="laptop-cloud"></g>
          <g id="dots-phone-cloud" class="dot-group" data-path="phone-cloud"></g>
          <g id="dots-tablet-cloud" class="dot-group" data-path="tablet-cloud"></g>
          <g id="dots-cloud-storage" class="dot-group" data-path="cloud-storage"></g>
          <g id="dots-cloud-email" class="dot-group" data-path="cloud-email"></g>
          <g id="dots-cloud-streaming" class="dot-group" data-path="cloud-streaming"></g>
          <g id="dots-cloud-aiml" class="dot-group" data-path="cloud-aiml"></g>
        </svg>
      </div>

      <!-- Scenario Selector -->
      <nav id="scenario-selector" aria-label="Select scenario">
        <button class="scenario-btn active" data-scenario="watch-movie" tabindex="0" aria-label="Watch a Movie scenario">
          <span class="scenario-icon">&#127916;</span>
          <span class="scenario-name">Watch a Movie</span>
        </button>
        <button class="scenario-btn" data-scenario="backup-photos" tabindex="0" aria-label="Backup Photos scenario">
          <span class="scenario-icon">&#128247;</span>
          <span class="scenario-name">Backup Photos</span>
        </button>
        <button class="scenario-btn" data-scenario="send-email" tabindex="0" aria-label="Send Email scenario">
          <span class="scenario-icon">&#9993;</span>
          <span class="scenario-name">Send Email</span>
        </button>
        <button class="scenario-btn" data-scenario="use-ai" tabindex="0" aria-label="Use AI Assistant scenario">
          <span class="scenario-icon">&#129302;</span>
          <span class="scenario-name">Use AI Assistant</span>
        </button>
      </nav>

      <!-- Info Panel -->
      <section id="info-panel" aria-label="Scenario information" role="status">
        <div id="info-content">
          <h2 id="info-title"></h2>
          <p id="info-description"></p>
          <div id="info-details"></div>
        </div>
      </section>

      <!-- Controls -->
      <section id="controls" aria-label="Animation controls">
        <button id="btn-play" class="ctrl-btn" tabindex="0" aria-label="Play animation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
          Play
        </button>
        <button id="btn-pause" class="ctrl-btn" tabindex="0" aria-label="Pause animation" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button id="btn-reset" class="ctrl-btn" tabindex="0" aria-label="Reset animation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          Reset
        </button>
        <label id="auto-toggle" class="ctrl-toggle" tabindex="0" aria-label="Toggle auto-demo mode">
          <input type="checkbox" id="chk-auto" aria-label="Auto-demo mode"/>
          <span class="toggle-track"></span>
          <span class="toggle-label">Auto-Demo</span>
        </label>
        <span id="auto-indicator" class="badge hidden" aria-live="polite">Auto-cycling</span>
      </section>
    </main>

    <footer id="footer">
      <p>Interactive Cloud Computing Diagram &mdash; Consica Labs</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>

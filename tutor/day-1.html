      border-radius: 0.75rem;

    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script>
    const courseData = {
      "day1": {
        module: "Module 1 &mdash; Foundations",
        title: "Day 1: How Computers Think (Binary)",
        objective: "Understand binary logic before coding",
        audioSrc: "assets/voice/day1-briefing.mp3",
        sections: [
          { icon: "fa-solid fa-lightbulb text-amber-500", title: "1. The Hook & The 'Why'", time: "10 Mins", content: '<p class="text-ink/80 mb-3">Before we turn on any computers or screens, ask the class:</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-slate-600 italic leading-relaxed">"How does a computer actually read what we type? If I press \'A\', how does the machine know?"</div><p class="mt-3 text-sm text-slate-500 leading-relaxed">Explain that computers don\'t speak English or Nepali. They run on electricity. Electricity can only be ON or OFF. Therefore, computers use a system of ONs (1s) and OFFs (0s) called <strong class="text-ink">Binary</strong>.</p>' },
          { icon: "fa-solid fa-circle-question text-amber-500", title: "2. The Engagement Check", time: "5 Mins", content: '<p class="text-sm text-slate-500 mb-3">Do not proceed until you have asked these questions.</p><ul class="space-y-3 text-sm"><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">Q1:</strong> "If a computer only understands on and off, how does it represent the number 2?" <em class="text-slate-400 block mt-0.5">Look for answers about combinations of signals</em></span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">Q2:</strong> "Why not just use decimal numbers (0-9) like we do?" <em class="text-slate-400 block mt-0.5">Hardware can\'t measure 10 different voltage levels accurately</em></span></li></ul>' },
          { icon: "fa-solid fa-wrench text-sky-500", title: "3. The 'How' & Tool Introduction", time: "10 Mins", content: '<p class="text-sm text-slate-500 mb-3 leading-relaxed">Have students open the Consica HTML Playground.</p><div class="bg-slate-800 border border-slate-700 rounded-lg p-3.5 font-mono text-xs leading-relaxed"><span class="text-sky-300">&lt;h1&gt;</span><span class="text-slate-200">Hello World</span><span class="text-sky-300">&lt;/h1&gt;</span></div><p class="mt-3 text-sm text-slate-500 leading-relaxed">Explain: HTML is a \'high-level language\'. The browser translates it behind the scenes into binary code (1s and 0s) that the processor understands.</p>' },
          { icon: "fa-solid fa-cubes text-sky-500", title: "4. The Guided Build", time: "20 Mins", content: '<p class="text-sm text-slate-500 mb-3 leading-relaxed">Instruct students to load <strong class="text-ink">Template #1: Basic Structure</strong>.</p><p class="text-sm text-slate-500 leading-relaxed">Walk around the room. Have them modify the text inside <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs font-mono text-brand-600">&lt;h1&gt;</code> and <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs font-mono text-brand-600">&lt;p&gt;</code> tags. Missing a closing bracket <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs font-mono text-brand-600">&gt;</code> breaks the translation (syntax error).</p>' },
          { icon: "fa-solid fa-triangle-exclamation text-amber-500", title: "5. Sandbox & Troubleshooting", time: "15 Mins", content: '<h4 class="font-semibold text-sm mb-2 text-ink">Common Errors to watch for today:</h4><ul class="list-disc list-inside text-sm text-slate-500 space-y-1.5"><li>Forgetting the forward slash <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">/</code> in closing tags.</li><li>Typing <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">h1</code> without the angle brackets.</li></ul><p class="mt-3 text-xs font-semibold text-amber-600 uppercase font-display tracking-wide">Instructor Rule: Do not type the code for them. Point to the screen and ask "what is missing here?"</p>' }
        ]
      },
      "day2": {
        module: "Module 1 &mdash; Foundations",
        title: "Day 2: Logic Gates & Basic Arduino",
        objective: "Connect binary to physical hardware",
        audioSrc: "assets/voice/day2-briefing.mp3",
        sections: [
          { icon: "fa-solid fa-lightbulb text-amber-500", title: "1. The Hook & Recap", time: "10 Mins", content: '<p class="text-sm text-slate-500 mb-3 leading-relaxed">Start with a quick binary recap. Hold up the Arduino board and say:</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-slate-600 italic leading-relaxed">"This tiny green board is like a brain that speaks in 1s and 0s. Let\'s teach it our language."</div><p class="mt-3 text-sm text-slate-500 leading-relaxed">Explain that the pins are just sending out \'1s\' (5 Volts) and \'0s\' (0 Volts).</p>' },
          { icon: "fa-solid fa-diagram-project text-sky-500", title: "2. Logic Gates Introduction", time: "15 Mins", content: '<p class="text-sm text-slate-500 mb-3">Draw AND, OR, and NOT gates on the board:</p><ul class="space-y-2.5 text-sm"><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-circle-check text-sky-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">AND Gate:</strong> "You need BOTH your homework AND your notebook to enter."</span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-circle-check text-sky-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">OR Gate:</strong> "You can use EITHER a pen OR a pencil to write."</span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-circle-check text-sky-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">NOT Gate:</strong> "If it\'s NOT raining, we go outside."</span></li></ul>' },
          { icon: "fa-solid fa-microchip text-sky-500", title: "3. Arduino Hands-On", time: "20 Mins", content: '<p class="text-sm text-slate-500 mb-3">Distribute Arduino kits. Guide students through connecting an LED to pin 13.</p><div class="bg-slate-800 border border-slate-700 rounded-lg p-3.5 font-mono text-xs text-slate-200 leading-relaxed"><span class="text-sky-300">void</span> <span>setup</span>() {<br>&nbsp;&nbsp;<span>pinMode</span>(<span class="text-amber-300">13</span>, <span class="text-slate-400">OUTPUT</span>);<br>}<br><br><span class="text-sky-300">void</span> <span>loop</span>() {<br>&nbsp;&nbsp;<span>digitalWrite</span>(<span class="text-amber-300">13</span>, <span class="text-slate-400">HIGH</span>);<br>&nbsp;&nbsp;<span>delay</span>(<span class="text-amber-300">1000</span>);<br>&nbsp;&nbsp;<span>digitalWrite</span>(<span class="text-amber-300">13</span>, <span class="text-slate-400">LOW</span>);<br>&nbsp;&nbsp;<span>delay</span>(<span class="text-amber-300">1000</span>);<br>}</div><p class="mt-3 text-sm text-slate-500">Let students upload and see their first blinking LED.</p>' },
          { icon: "fa-solid fa-circle-question text-amber-500", title: "4. The Engagement Check", time: "10 Mins", content: '<ul class="space-y-3 text-sm"><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">Q1:</strong> "If you wanted the LED to only turn on when it\'s dark AND someone is in the room, which logic gate would you use?"</span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5 flex-shrink-0"></i><span><strong class="text-ink">Q2:</strong> "What happens if we connect the LED without a resistor? Why is that dangerous?"</span></li></ul>' },
          { icon: "fa-solid fa-triangle-exclamation text-amber-500", title: "5. Sandbox & Troubleshooting", time: "5 Mins", content: '<ul class="list-disc list-inside text-sm text-slate-500 space-y-1.5"><li>LED not lighting? Check if the longer leg (anode) is connected to pin 13.</li><li>Board not detected? Verify USB cable and driver installation.</li><li>Compilation error? Double-check semicolons at every statement.</li></ul>' }
        ]
      },
      "day3": {
        module: "Module 1 &mdash; Foundations",
        title: "Day 3: Variables & Data Types",
        objective: "Introduce programming variables with real-world analogies",
        audioSrc: "assets/voice/day3-briefing.mp3",
        sections: [
          { icon: "fa-solid fa-lightbulb text-amber-500", title: "1. The Hook — What's in a Box?", time: "10 Mins", content: '<p class="text-sm text-slate-500 mb-3">Bring a physical box to class. Write "age" on it and put the number 12 inside.</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-slate-600 italic leading-relaxed">"This box is a \'variable\'. The label is its \'name\', and whatever is inside is its \'value\'. Computers use thousands of these boxes to remember things."</div>' },
          { icon: "fa-solid fa-code text-sky-500", title: "2. Coding Variables", time: "20 Mins", content: '<p class="text-sm text-slate-500 mb-3">Open the Consica Playground:</p><div class="bg-slate-800 border border-slate-700 rounded-lg p-3.5 font-mono text-xs text-slate-200 leading-relaxed"><span class="text-sky-300">let</span> <span>studentName</span> = <span class="text-amber-300">"Ram"</span>;<br><span class="text-sky-300">let</span> <span>age</span> = <span class="text-amber-300">14</span>;<br><span class="text-sky-300">let</span> <span>isPresent</span> = <span class="text-amber-300">true</span>;<br><span>console.log</span>(studentName + <span class="text-amber-300">" is "</span> + age);</div><p class="mt-3 text-sm text-slate-500">Three basic types: <strong class="text-ink">String</strong> (quotes), <strong class="text-ink">Number</strong> (no quotes), <strong class="text-ink">Boolean</strong> (true/false).</p>' },
          { icon: "fa-solid fa-circle-question text-amber-500", title: "3. The Engagement Check", time: "10 Mins", content: '<ul class="space-y-3 text-sm"><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5"></i><span><strong class="text-ink">Q1:</strong> "If age = 14, what type of data is age?" <em class="text-slate-400 block mt-0.5">Number</em></span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5"></i><span><strong class="text-ink">Q2:</strong> "Why quotes around \'Ram\' but not 14?" <em class="text-slate-400 block mt-0.5">Text needs quotes, numbers don\'t</em></span></li></ul>' },
          { icon: "fa-solid fa-cubes text-sky-500", title: "4. Guided Practice", time: "15 Mins", content: '<p class="text-sm text-slate-500">Ask students to create variables for: their name, age, favorite subject, and whether they have a pet. Then print it all using <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs font-mono text-brand-600">console.log()</code>. Walk around and assist.</p>' },
          { icon: "fa-solid fa-triangle-exclamation text-amber-500", title: "5. Troubleshooting", time: "5 Mins", content: '<ul class="list-disc list-inside text-sm text-slate-500 space-y-1.5"><li>Strings without quotes are treated as variable names.</li><li><code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">let</code> cannot be used twice for same variable.</li><li>Case matters: <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">studentName</code> vs <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">studentname</code>.</li></ul>' }
        ]
      },
      "day4": {
        module: "Module 2 &mdash; Logic & Control Flow",
        title: "Day 4: If/Else Decisions",
        objective: "Teach conditional logic through gamified examples",
        audioSrc: "assets/voice/day4-briefing.mp3",
        sections: [
          { icon: "fa-solid fa-lightbulb text-amber-500", title: "1. Real-World Decisions", time: "10 Mins", content: '<p class="text-sm text-slate-500 mb-3">Ask the class:</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-slate-600 italic">"How do you decide whether to bring an umbrella to school?"</div><p class="mt-3 text-sm text-slate-500">Write their answers: <span class="text-brand-500 font-semibold">IF</span> it\'s raining <span class="text-brand-500 font-semibold">THEN</span> bring umbrella <span class="text-brand-500 font-semibold">ELSE</span> don\'t bring it.</p>' },
          { icon: "fa-solid fa-code text-sky-500", title: "2. Coding If/Else", time: "20 Mins", content: '<div class="bg-slate-800 border border-slate-700 rounded-lg p-3.5 font-mono text-xs text-slate-200"><span class="text-sky-300">let</span> <span>weather</span> = <span class="text-amber-300">"rainy"</span>;<br><br><span class="text-sky-300">if</span> (weather === <span class="text-amber-300">"rainy"</span>) {<br>&nbsp;&nbsp;<span>console.log</span>(<span class="text-amber-300">"Bring an umbrella!"</span>);<br>} <span class="text-sky-300">else</span> {<br>&nbsp;&nbsp;<span>console.log</span>(<span class="text-amber-300">"No umbrella needed."</span>);<br>}</div><p class="mt-3 text-sm text-slate-500">Have students modify conditions. Try adding <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs font-mono text-brand-600">else if</code>.</p>' },
          { icon: "fa-solid fa-circle-question text-amber-500", title: "3. The Engagement Check", time: "10 Mins", content: '<ul class="space-y-3 text-sm"><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5"></i><span><strong class="text-ink">Q1:</strong> "What if none of the if/else if conditions are true?" <em class="text-slate-400 block mt-0.5">The else block runs</em></span></li><li class="flex items-start gap-2.5 text-slate-700"><i class="fa-solid fa-clipboard-question text-amber-500 mt-0.5"></i><span><strong class="text-ink">Q2:</strong> "Can you have an if without an else?" <em class="text-slate-400 block mt-0.5">Yes, else is optional</em></span></li></ul>' },
          { icon: "fa-solid fa-gamepad text-sky-500", title: "4. Mini Game: Number Guesser", time: "15 Mins", content: '<p class="text-sm text-slate-500 mb-2">Challenge: write a program where a secret number is set (e.g., 7), and the code says "Too high!", "Too low!", or "Correct!".</p><p class="text-xs text-slate-400 font-display uppercase tracking-wide mt-3">Hint: Use if / else if / else with &gt;, &lt;, ===</p>' },
          { icon: "fa-solid fa-triangle-exclamation text-amber-500", title: "5. Troubleshooting", time: "5 Mins", content: '<ul class="list-disc list-inside text-sm text-slate-500 space-y-1.5"><li><code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">=</code> is assignment, <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">===</code> is comparison.</li><li>Curly braces <code class="bg-slate-100 px-1 py-0.5 rounded text-xs font-mono text-brand-600">{}</code> must match.</li><li>Conditions inside parentheses must be true or false.</li></ul>' }
        ]
      },
      "day5": {
        module: "Module 2 &mdash; Logic & Control Flow",
        title: "Day 5: Loops — Doing Things Repeatedly",
        objective: "Master for loops and while loops with visual examples",
        audioSrc: "assets/voice/day5-briefing.mp3",
        sections: [
          { icon: "fa-solid fa-lightbulb text-amber-500", title: "1. The Hook — Repetition", time: "8 Mins", content: '<p class="text-sm text-slate-500 mb-3">Ask: "If I asked you to write your name 100 times on the board, how would you feel? Now imagine telling a computer to do it."</p><div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-slate-600 italic">"Computers love repetition. They never get tired. That\'s why we have LOOPS."</div>' },

    /* ── Module icons ── */
    var moduleMeta = {
      "Module 1 — Foundations":              { icon: "fa-solid fa-microchip", desc: "Binary, transistors, logic gates, and variables" },
      "Module 2 — Logic & Control Flow":     { icon: "fa-solid fa-code-branch", desc: "If/else decisions and loop structures" },
      "Module 3 — HTML & Web Pages":        { icon: "fa-solid fa-globe", desc: "Building and styling complete web pages" },
      "Module 4 — JavaScript Interactivity": { icon: "fa-solid fa-hand-pointer", desc: "Buttons, events, forms, and user interaction" },
      "Module 5 — Final Project":           { icon: "fa-solid fa-trophy", desc: "Combine everything into a portfolio website" },
    };

    var dayIds = Object.keys(courseData);
    var currentDay = null;

    /* ── Group lessons by module ── */
    function getModules() {
      var modules = {};
      dayIds.forEach(function(id) {
        var m = courseData[id].module.replace(/&mdash;/g, '\u2014');
        if (!modules[m]) modules[m] = [];
        modules[m].push(id);
      });
      return modules;
    }

    /* ── Render sidebar nav ── */
    function renderSidebar() {
      var modules = getModules();
      var html = '';

      html += '<p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-3 font-display">Builder Tier (Class 8\u201310)</p>';

      Object.keys(modules).forEach(function(modName) {
        html += '<p class="text-[10px] font-semibold text-brand-500 uppercase tracking-wider mt-5 mb-2 font-display opacity-70">' + modName + '</p>';
        modules[modName].forEach(function(dayId) {
          var data = courseData[dayId];
          var label = data.title.replace(/Day \d+: /, '');
          var isActive = currentDay === dayId;
          html += '<a href="#' + dayId + '" class="sidebar-link block px-3 py-2 rounded-lg text-sm transition-colors no-underline '
            + (isActive ? 'active text-white font-semibold' : 'text-slate-500 hover:bg-slate-100 hover:text-ink')
            + '" data-day="' + dayId + '"><span class="text-[10px] text-slate-400 mr-1.5">' + data.title.match(/Day \d+/)[0] + '</span>' + label + '</a>';
        });
      });

      html += '<p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mt-5 mb-2 font-display">Resources</p>';
      html += '<a href="why-computers-use-binary.html" class="sidebar-link block px-3 py-2 rounded-lg text-sm transition-colors no-underline text-slate-500 hover:bg-slate-100 hover:text-ink"><i class="fa-solid fa-file-lines text-xs mr-2 opacity-40"></i>Why Binary?</a>';

      document.getElementById('desktop-nav-inner').innerHTML = html;
      document.getElementById('mobile-nav-inner').innerHTML = html;

      /* Bind nav clicks */
      var links = document.querySelectorAll('.sidebar-link[data-day]');
      links.forEach(function(link) {
        link.onclick = function(e) {
          e.preventDefault();
          var dayId = link.getAttribute('data-day');
          selectLesson(dayId);
          closeMobileNav();
        };
      });
    }

    /* ── Render module + lesson grid ── */
    function renderGrid() {
      var modules = getModules();
      var html = '';

      Object.keys(modules).forEach(function(modName) {
        var meta = moduleMeta[modName.replace(/\u2014/g, '—')] || {};
        html += '<div class="module-card p-5 md:p-6">';
        html += '<div class="flex items-center gap-3 mb-4">';
        html += '<div class="w-10 h-10 bg-brand-50 rounded-lg flex items-center justify-center flex-shrink-0 text-brand-500 text-lg"><i class="' + (meta.icon || 'fa-solid fa-book') + '"></i></div>';
        html += '<div><h3 class="font-bold text-ink font-display text-lg leading-tight">' + modName + '</h3>';
        html += '<p class="text-xs text-slate-400 mt-0.5">' + (meta.desc || '') + '</p></div></div>';
        html += '<div class="grid sm:grid-cols-2 gap-2.5">';

        modules[modName].forEach(function(dayId) {
          var data = courseData[dayId];
          var dayNum = data.title.match(/Day \d+/)[0];
          var label = data.title.replace(/Day \d+: /, '');
          var isSelected = currentDay === dayId;
          html += '<div class="lesson-card p-4 ' + (isSelected ? 'selected' : '') + '" data-day="' + dayId + '" id="card-' + dayId + '">';
          html += '<div class="flex justify-between items-start mb-1.5">';
          html += '<span class="text-[11px] font-semibold text-brand-500 uppercase tracking-wider font-display">' + dayNum + '</span>';
          html += '<span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock mr-1"></i>60 min</span>';
          html += '</div>';
          html += '<h4 class="font-semibold text-ink mb-1 text-sm">' + label + '</h4>';
          html += '<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">' + data.objective + '</p>';
          html += '</div>';
        });

        html += '</div></div>';
      });

      document.getElementById('modules-grid').innerHTML = html;

      /* Bind card clicks */
      var cards = document.querySelectorAll('.lesson-card');
      cards.forEach(function(card) {
        card.onclick = function() {
          var dayId = card.getAttribute('data-day');
          selectLesson(dayId);
        };
      });
    }

    /* ── Select & load a lesson ── */
    function selectLesson(dayId) {
      currentDay = dayId;

      /* Update sidebar active */
      renderSidebar();
      /* Update card selection */
      var cards = document.querySelectorAll('.lesson-card');
      cards.forEach(function(c) { c.classList.toggle('selected', c.getAttribute('data-day') === dayId); });

      /* Scroll card into view */
      var activeCard = document.getElementById('card-' + dayId);
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

      /* Render detail */
      renderDetail(dayId);
    }

    /* ── Render lesson detail ── */
    function renderDetail(dayId) {
      var data = courseData[dayId];
      var detail = document.getElementById('lesson-detail');
      detail.style.display = 'block';

      var html = '';
      html += '<div class="border-t-2 border-brand-500 pt-8">';
      html += '<div class="flex flex-wrap items-center justify-between gap-3 mb-6">';
      html += '<div>';
      html += '<span class="text-xs text-brand-500 font-semibold uppercase tracking-wider font-display">' + data.module + '</span>';
      html += '<h2 class="text-2xl font-extrabold text-ink font-display mt-1">' + data.title + '</h2>';
      html += '<p class="text-slate-500 text-sm mt-1"><i class="fa-solid fa-bullseye mr-1.5 text-brand-400"></i>' + data.objective + '</p>';
      html += '</div>';
      html += '<button id="close-detail" class="text-slate-400 hover:text-ink transition-colors p-2" title="Close"><i class="fa-solid fa-xmark text-lg"></i></button>';
      html += '</div>';

      /* Audio player */
      if (data.audioSrc) {
        html += '<div class="mb-6 rounded-xl p-4 bg-brand-50 border border-brand-100">';
        html += '<audio id="audio-player" controls preload="auto" src="' + data.audioSrc + '" class="audio-native w-full h-9 rounded-lg bg-white outline-none"></audio>';
        html += '<p class="text-[10px] text-brand-400 mt-2 uppercase tracking-wider font-medium"><i class="fa-solid fa-headphones mr-1"></i>Founder\'s Briefing</p>';
        html += '</div>';
      }

      /* Sections */
      html += '<div class="space-y-4">';
      data.sections.forEach(function(sec) {
        var iconColor = sec.icon.match(/text-(\w+-\d+)/) ? sec.icon.match(/text-(\w+-\d+)/)[1] : 'brand-500';
        html += '<div class="section-item p-5">';
        html += '<div class="flex justify-between items-center mb-3">';
        html += '<h3 class="font-bold text-ink font-display flex items-center gap-2.5"><i class="' + sec.icon + ' text-lg"></i>' + sec.title + '</h3>';
        html += '<span class="text-xs font-semibold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full font-display"><i class="fa-regular fa-clock mr-1"></i>' + sec.time + '</span>';
        html += '</div>';
        html += '<div class="text-sm leading-relaxed">' + sec.content + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';

      detail.innerHTML = html;

      /* Bind close */
      document.getElementById('close-detail').onclick = function() {
        currentDay = null;
        detail.style.display = 'none';
        renderSidebar();
        var cards = document.querySelectorAll('.lesson-card');
        cards.forEach(function(c) { c.classList.remove('selected'); });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      /* Scroll to detail */
      detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Mobile nav ── */
    function setupMobileNav() {
      var overlay = document.getElementById('mobile-nav-overlay');
      document.getElementById('mobile-menu-btn').onclick = function() { overlay.classList.remove('hidden'); };
      document.getElementById('mobile-nav-close').onclick = function() { overlay.classList.add('hidden'); };
      document.getElementById('overlay-backdrop').onclick = function() { overlay.classList.add('hidden'); };
    }

    function closeMobileNav() {
      document.getElementById('mobile-nav-overlay').classList.add('hidden');
    }

    /* ── Init ── */
    renderSidebar();
    renderGrid();
    setupMobileNav();
  </script>
</body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Diagram->Vocab Test</title>
<style>.highlight-pulse{{animation:row-highlight-pulse 1s ease-in-out 1;}}@keyframes row-highlight-pulse{{0%{{background:transparent}}50%{{background:#fff3bf}}100%{{background:transparent}}}}</style>
</head><body>
<h3>QA: Diagram selection -> scrollToVocabulary</h3>
<table id="vocab-table">
  <tr id="vocab-project-specs"><td>Project Specs</td><td>Description</td></tr>
  <tr id="vocab-integration"><td>Integration</td><td>Description</td></tr>
  <tr id="vocab-debugging"><td>Debugging</td><td>Description</td></tr>
</table>

<script src="/shared/utils/dom.js"></script>
<script src="/shared/utils/vocab-aliases.js"></script>
<script>
// simulate postMessage selection
function postSelect(id) {
  window.postMessage({type:'diagram-select', id:id}, '*');
}
// simulate in-page custom event
function emitSelect(id) {
  var ev = new CustomEvent('diagram-select', {detail:{id:id}});
  document.dispatchEvent(ev);
}
// UI
var btn1 = document.createElement('button'); btn1.textContent='Post select node1'; btn1.onclick=function(){postSelect('node1')}; document.body.appendChild(btn1);
var btn2 = document.createElement('button'); btn2.textContent='Emit select node2'; btn2.onclick=function(){emitSelect('node2')}; document.body.appendChild(btn2);
var btn3 = document.createElement('button'); btn3.textContent='Post select debugging'; btn3.onclick=function(){postSelect('debugging')}; document.body.appendChild(btn3);
</script>
</body></html>

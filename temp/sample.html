
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consica Labs | Instructor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .section-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Left Sidebar: Navigation -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col h-full z-20 shadow-xl hidden md:flex">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-blue-400"></i> Consica Labs
            </h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">Instructor Portal</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4">
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Builder Tier (Class 8-10)</h2>
                <ul class="space-y-1" id="nav-list">
                    <!-- Nav items injected via JS -->
                </ul>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-800">
            <button class="w-full py-2 px-4 bg-slate-800 hover:bg-slate-700 text-sm rounded transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Main Site
            </button>
        </div>
    </aside>

    <!-- Mobile Header -->
    <div class="md:hidden fixed top-0 left-0 right-0 bg-slate-900 text-white p-4 z-30 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i> Consica Labs</h1>
        <button id="mobile-menu-btn" class="text-slate-300 hover:text-white"><i class="fa-solid fa-bars text-xl"></i></button>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden pt-14 md:pt-0">
        
        <!-- Center Console: Lesson Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
            <div class="max-w-3xl mx-auto pb-20 md:pb-0">
                
                <!-- Header & Audio Player -->
                <header class="mb-8">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-3 inline-block" id="module-badge">Module 1</span>
                    <h2 class="text-3xl font-bold text-slate-900 mb-2" id="lesson-title">Loading...</h2>
                    <p class="text-slate-500 flex items-center gap-4 text-sm mb-6">
                        <span><i class="fa-regular fa-clock mr-1"></i> 60 Mins</span>
                        <span><i class="fa-solid fa-bullseye mr-1"></i> <span id="lesson-objective"></span></span>
                    </p>

                    <!-- Custom Audio Player Card -->
                    <div class="bg-gradient-to-r from-blue-600 to-blue-800 rounded-xl p-4 text-white shadow-lg flex items-center gap-4">
                        <button id="play-btn" class="w-12 h-12 bg-white text-blue-600 rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-md flex-shrink-0">
                            <i class="fa-solid fa-play ml-1" id="play-icon"></i>
                        </button>
                        <div class="flex-1">
                            <div class="flex justify-between text-xs mb-1 font-medium text-blue-100">
                                <span>Founder's Briefing</span>
                                <span>0:00 / 2:45</span>
                            </div>
                            <!-- Mock Progress Bar -->
                            <div class="w-full bg-blue-900/50 rounded-full h-2 mt-2 cursor-pointer">
                                <div class="bg-white h-2 rounded-full w-0" style="width: 35%"></div>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Dynamic Content Container -->
                <div id="lesson-content" class="space-y-6">
                    <!-- Sections will be injected here -->
                </div>

            </div>
        </div>

    </main>

    <script>
        // Database of lessons (You can expand this in your actual site)
        const courseData = {
            "day1": {
                module: "Module 1: Foundations",
                title: "Day 1: How Computers Think (Binary)",
                objective: "Understand binary logic before coding",
                audioSrc: "path/to/your/audio1.mp3", // Replace with real path
                sections: [
                    {
                        icon: "fa-solid fa-lightbulb text-yellow-500",
                        title: "1. The Hook & The 'Why'",
                        time: "10 Mins",
                        color: "border-yellow-400",
                        bg: "bg-yellow-50/50",
                        content: `<p class="font-medium mb-2">Before we turn on any computers or screens, ask the class:</p>
                                  <div class="bg-white p-3 rounded border border-slate-200 text-slate-700 italic">"How does a computer actually read what we type? If I press 'A', how does the machine know?"</div>
                                  <p class="mt-2 text-sm text-slate-600">Explain that computers don't speak English or Nepali. They run on electricity. Electricity can only be ON or OFF. Therefore, computers use a system of ONs (1s) and OFFs (0s) called Binary.</p>`
                    },
                    {
                        icon: "fa-solid fa-circle-question text-red-500",
                        title: "2. The Engagement Check",
                        time: "5 Mins",
                        color: "border-red-400",
                        bg: "bg-red-50/50",
                        content: `<p class="text-sm text-slate-600 mb-3">Do not proceed until you have asked these questions and received an answer from the students.</p>
                                  <ul class="space-y-2 text-sm">
                                    <li class="flex items-start gap-2"><i class="fa-solid fa-clipboard-question text-red-400 mt-1"></i> <strong>Q1:</strong> "If a computer only understands on and off, how do you think it represents the number 2?" <em>(Listen for answers relating to combinations of signals).</em></li>
                                    <li class="flex items-start gap-2"><i class="fa-solid fa-clipboard-question text-red-400 mt-1"></i> <strong>Q2:</strong> "Why couldn't a computer just use decimal numbers (0-9) like we do?" <em>(Answer: Hardware limitation, hard to measure 10 different voltage levels accurately).</em></li>
                                  </ul>`
                    },
                    {
                        icon: "fa-solid fa-wrench text-blue-500",
                        title: "3. The 'How' & Tool Introduction",
                        time: "10 Mins",
                        color: "border-blue-400",
                        bg: "bg-blue-50/50",
                        content: `<p class="text-sm text-slate-600 mb-2">Have students open the Consica HTML Playground on their mobile devices.</p>
                                  <div class="bg-slate-800 text-slate-300 p-3 rounded font-mono text-xs mb-2">
                                    &lt;h1&gt;Hello World&lt;/h1&gt;
                                  </div>
                                  <p class="text-sm text-slate-600">Explain: When we type this HTML, we are using a 'high-level language'. The browser in the playground translates this behind the scenes into the binary code (1s and 0s) that the phone's processor actually understands to light up the pixels.</p>`
                    },
                    {
                        icon: "fa-solid fa-cubes text-purple-500",
                        title: "4. The Guided Build",
                        time: "20 Mins",
                        color: "border-purple-400",
                        bg: "bg-purple-50/50",
                        content: `<p class="text-sm text-slate-600 mb-2">Instruct students to load <strong>Template #1: Basic Structure</strong>.</p>
                                  <p class="text-sm text-slate-600">Walk around the room. Have them modify the text inside the <code>&lt;h1&gt;</code> and <code>&lt;p&gt;</code> tags. Point out that missing a closing bracket <code>></code> will break the translation process (syntax error).</p>`
                    },
                    {
                        icon: "fa-solid fa-triangle-exclamation text-orange-500",
                        title: "5. Sandbox & Troubleshooting",
                        time: "15 Mins",
                        color: "border-orange-400",
                        bg: "bg-orange-50/50",
                        content: `<h4 class="font-medium text-sm mb-1">Common Errors to watch for today:</h4>
                                  <ul class="list-disc list-inside text-sm text-slate-600 space-y-1">
                                    <li>Forgetting the forward slash <code>/</code> in closing tags.</li>
                                    <li>Typing <code>h1</code> without the angle brackets.</li>
                                  </ul>
                                  <p class="mt-2 text-xs font-semibold text-slate-500 uppercase">Instructor Rule: Do not type the code for them. Point to the screen and ask them "what is missing here?"</p>`
                    }
                ]
            },
            "day2": {
                module: "Module 1: Foundations",
                title: "Day 2: Logic Gates & Basic Arduino",
                objective: "Connect binary to physical hardware",
                sections: [
                    {
                        icon: "fa-solid fa-lightbulb text-yellow-500",
                        title: "1. The Hook",
                        time: "10 Mins",
                        color: "border-yellow-400",
                        bg: "bg-yellow-50/50",
                        content: "<p>Recap yesterday's binary lesson. Show them the Arduino board and explain that the pins are just sending out '1s' (5 Volts) and '0s' (0 Volts).</p>"
                    }
                    // Add more sections here for Day 2
                ]
            }
        };

        let currentDayId = 'day1';

        // --- DOM Elements ---
        const navList = document.getElementById('nav-list');
        const lessonTitle = document.getElementById('lesson-title');
        const moduleBadge = document.getElementById('module-badge');
        const lessonObjective = document.getElementById('lesson-objective');
        const lessonContent = document.getElementById('lesson-content');
        
        // --- Initialization ---
        function init() {
            renderNav();
            loadLesson(currentDayId);
        }

        // --- Render Navigation ---
        function renderNav() {
            navList.innerHTML = '';
            Object.keys(courseData).forEach(dayId => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                const isActive = dayId === currentDayId;
                
                btn.className = `w-full text-left px-3 py-2 rounded-md text-sm transition-colors ${isActive ? 'bg-blue-600 text-white font-medium shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                btn.innerHTML = `<i class="fa-solid fa-book-open text-xs mr-2 ${isActive ? 'text-blue-200' : 'opacity-50'}"></i> ${courseData[dayId].title.split(':')[0]}`; // Just show "Day X"
                
                btn.onclick = () => {
                    currentDayId = dayId;
                    renderNav();
                    loadLesson(dayId);
                };
                
                li.appendChild(btn);
                navList.appendChild(li);
            });
        }

        // --- Load Lesson Content ---
        function loadLesson(dayId) {
            const data = courseData[dayId];
            moduleBadge.textContent = data.module;
            lessonTitle.textContent = data.title;
            lessonObjective.textContent = data.objective;
            
            // Reset Audio UI
            const playIcon = document.getElementById('play-icon');
            playIcon.className = "fa-solid fa-play ml-1";
            isPlaying = false;

            lessonContent.innerHTML = '';
            data.sections.forEach(sec => {
                const card = document.createElement('div');
                card.className = `section-card bg-white rounded-xl shadow-sm border-l-4 ${sec.color} overflow-hidden`;
                
                card.innerHTML = `
                    <div class="px-5 py-4 border-b border-slate-100 ${sec.bg} flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2 text-lg">
                            <i class="${sec.icon}"></i> ${sec.title}
                        </h3>
                        <span class="text-xs font-semibold bg-white px-2 py-1 rounded shadow-sm text-slate-600">
                            <i class="fa-regular fa-clock mr-1"></i> ${sec.time}
                        </span>
                    </div>
                    <div class="p-5 text-slate-800 leading-relaxed">
                        ${sec.content}
                    </div>
                `;
                lessonContent.appendChild(card);
            });
        }

        // --- Audio Player Mock Logic ---
        let isPlaying = false;
        document.getElementById('play-btn').addEventListener('click', function() {
            const icon = document.getElementById('play-icon');
            isPlaying = !isPlaying;
            if(isPlaying) {
                icon.className = "fa-solid fa-pause";
                // In production: audio.play()
            } else {
                icon.className = "fa-solid fa-play ml-1";
                // In production: audio.pause()
            }
        });

        // Run
        init();
    </script>
</body>
</html>
